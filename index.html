<script>
const DL={0:'월',1:'화',2:'수',3:'목',4:'금',41:'금(댄)',5:'토'};
const COL=[0,1,2,3,4,41,5];
const SAT_T=['11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
const WK_T=['13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00'];
const ALL_T=[...new Set([...SAT_T,...WK_T])].sort((a,b)=>parseInt(a)-parseInt(b));
// DD: 요일별 날짜 목록 - 현재 날짜 기준 동적 생성
function buildDD(){
  const now=new Date();
  const todayDay=now.getDay(); // 0=일,1=월...6=토
  // 이번 주 월요일
  const mon=new Date(now);
  mon.setDate(now.getDate()-(todayDay===0?6:todayDay-1));
  mon.setHours(0,0,0,0);

  const fmt=(d)=>`${d.getMonth()+1}/${d.getDate()}`;

  // 각 요일별 최근 5주 날짜 생성
  function datesForOffset(offset){
    const dates=[];
    for(let w=4;w>=0;w--){
      const d=new Date(mon);
      d.setDate(mon.getDate()+offset-w*7);
      if(d<=now) dates.push(fmt(d));
    }
    return dates;
  }

  return {
    0:datesForOffset(0), // 월
    1:datesForOffset(1), // 화
    2:datesForOffset(2), // 수
    3:datesForOffset(3), // 목
    4:datesForOffset(4), // 금
    41:datesForOffset(4), // 금(댄)
    5:datesForOffset(5), // 토
  };
}
let DD=buildDD();
// 날짜 변경 감지 (자정 넘어가면 갱신)
setInterval(()=>{DD=buildDD();},60000);
const DTI=10;

let T=[
  {name:'보컬박',s:'박',sub:'보컬',c:'#E53935'},{name:'보컬정',s:'정',sub:'보컬',c:'#F57C00'},

// 오늘 요일 → selDay 자동 설정 (0=일→월,1=화,2=수,3=목,4=금,5=토)
function getTodayAppDay(){
  const d=new Date().getDay(); // 0=일,1=월...6=토
  if(d===0)return 1; // 일요일이면 월요일로
  return d-1; // 1=월,2=화...6=토
}

const gTi=()=>role==='admin'?null:parseInt(role);
const isAdm=()=>role==='admin';
const isLoginAdm=()=>loginRole==='admin'; // 실제 관리자 로그인 여부
function calcW(l){if(!l.startDate)return 0;const d=Math.floor((new Date('2026-04-24')-new Date(l.startDate))/864e5);return d<0?0:Math.floor(d/7)+1;}
function needsN(l){const w=calcW(l),mw=l.maxWeek||4;return w>0&&w%mw===0;}
function getNtc(){return lessons.filter(l=>l.type==='individual'&&needsN(l));}
function hasMk(ti,s){return mks.some(m=>m.ti===ti&&m.student===s);}
function totSt(){return new Set(lessons.filter(l=>l.type==='individual').map(l=>l.student+'_'+l.ti)).size;}
function myStCnt(ti){return new Set(lessons.filter(l=>l.type==='individual'&&l.ti===ti).map(l=>l.student)).size;}
function updCnt(){
  const el=document.getElementById('cnt');
  if(!el) return;
  if(isAdm()){
    const indiv=lessons.filter(l=>l.type==='individual'&&l.ti!==DTI&&l.day!==41);
    const total=new Set(indiv.map(l=>l.student+'_'+l.ti)).size;
    const w1=new Set(indiv.filter(l=>(l.freq||1)===1).map(l=>l.student+'_'+l.ti)).size;
    const w2=new Set(indiv.filter(l=>(l.freq||1)>=2).map(l=>l.student+'_'+l.ti)).size;
    const ips=new Set(indiv.filter(l=>l.course==='입시').map(l=>l.student+'_'+l.ti)).size;
    const hby=new Set(indiv.filter(l=>l.course==='취미').map(l=>l.student+'_'+l.ti)).size;
    el.style.display='';
    el.style.cssText='display:block;background:rgba(0,0,0,.75);color:#fff;font-size:10px;padding:3px 12px;text-align:center;flex-shrink:0;cursor:pointer;white-space:nowrap;overflow-x:auto;';
    el.onclick=()=>showView('stat');
    el.textContent=`👥 총 ${total}명  ·  주1회 ${w1}명  ·  주2회 ${w2}명  ·  입시 ${ips}명  ·  취미 ${hby}명`;
  } else {
    const ti=gTi();
    if(ti!==null){
      el.style.display='block';
      el.style.cssText='display:block;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:3px 12px;text-align:center;flex-shrink:0;';
      el.textContent=`담당 ${myStCnt(ti)}명`;
    } else {
      el.style.display='none';
    }
  }
}

function rDay(){
  const ti=gTi();

  // 탭: 댄스선생님은 금(댄)만, 그외는 금만, 관리자는 둘다
  const TABS=[
    {id:0,l:'월'},{id:1,l:'화'},{id:2,l:'수'},{id:3,l:'목'},
    ...(isAdminV||!isDanceT?[{id:4,l:'금'}]:[]),

    {id:5,l:'토'}
  ];
  let h=`<div class="chip-bar">`;
  TABS.forEach(tab=>{const on=selDay===tab.id,dance=tab.id===41;h+=`<button class="chip${on?' on':''}${on&&dance?' dance':''}" onclick="selDay=${tab.id};rDay()">${tab.l}</button>`;});
  h+=`</div>`;
  const dates=DD[selDay]||[],isDance=selDay===41;
  if(dates.length)h+=`<div class="info-bar">수업일: ${dates.join(' · ')}</div>`;
  if(isDance)h+=`<div class="dance-lbl">🕺 금요일 댄스 전용</div>`;
  const tio=T.map((_,i)=>i);
  const dayL=lessons.filter(l=>l.day===selDay&&(ti===null||l.ti===ti));
  const indiv=[...dayL.filter(l=>l.type==='individual')].sort((a,b)=>tio.indexOf(a.ti)-tio.indexOf(b.ti)||a.time.localeCompare(b.time));
  const grps=dayL.filter(l=>l.type==='group');
  if(!indiv.length&&!grps.length)h+=`<div class="empty">이 요일 수업이 없습니다</div>`;
  else{
    h+='<div style="height:8px"></div>';
    indiv.forEach(l=>{h+=crd(l,ti);});
    if(grps.length){h+=`<div class="band-lbl">🎸 밴드/합주/특강</div>`;grps.forEach(l=>{const t=T[l.ti]||{};h+=`<div class="card" style="border-left-color:#777"><div class="card-top"><div style="font-size:13px;font-weight:700">${l.time} ${l.groupname}</div><span style="font-size:11px;color:${t.c||'#888'};font-weight:600">${t.name||''}</span></div></div>`;});}
  }
  if(isAdm()){const lbl=isDance?'금(댄)':DL[selDay]||'';h+=`<button class="add-btn${isDance?' dance':''}" onclick="openAdd(${selDay},null,${isDance?DTI:'null'})">+ ${lbl} 수업 추가</button>`;}
  document.getElementById('page').innerHTML=h;
}

function crd(l,ti){

// ── 전체 학생 ────────────────────────────────────────────
function rStud(){
  const ntc=getNtc();const tio=T.map((_,i)=>i);
  const uniq=[...new Map(lessons.filter(l=>l.type==='individual').map(l=>[l.student+'_'+l.ti+'_'+l.day,l])).values()].sort((a,b)=>tio.indexOf(a.ti)-tio.indexOf(b.ti));
  const tot=totSt();
  let h=`<div class="sec-lbl">전체 학생 (총 ${tot}명)</div>`;
  if(ntc.length){h+=`<div class="nbar"><div class="nt">📢 오늘 수강 안내 대상 (${ntc.length}명)</div>`;ntc.forEach(l=>{const t=T[l.ti]||{};h+=`<div class="nr">• ${l.student} · ${t.name||''} · 주${l.freq}회 · ${calcW(l)}/${l.maxWeek||4}주차</div>`;});h+=`</div>`;}
  const reg=uniq.filter(l=>l.ti!==DTI),dance=uniq.filter(l=>l.ti===DTI);
  reg.forEach(l=>{h+=liH(l,ntc);});

}
function liH(l,ntc){

  const pct=Math.min(100,Math.round(w/mw*100));
  const wc=w>=mw?'#C00000':w>=(mw*.7)?'#854F0B':'#3B6D11';
  const wbg=w>=mw?'#FFEBEE':w>=(mw*.7)?'#FAEEDA':'#EAF3DE';
  const idx=lessons.indexOf(l);
  return `<div class="li" style="border-left-color:${t.c||'#ccc'};cursor:pointer" onclick="goToStudent(${l.ti},'${l.student}')">

      ${l.student}${mk.length?`<span class="upd">보강</span>`:''}
      ${l.course==='입시'?`<span class="course-i">입시</span>`:''}${isN?'<span class="ntc">안내필요</span>':''}
    </div>
    <div style="font-size:10px;color:${t.c||'#888'};margin-top:2px">${t.name||''} · ${DL[l.day]||''} ${l.time} · ${l.level||''}</div>
    <div style="margin-top:4px;display:flex;align-items:center;gap:6px">
      <div class="progress-wrap"><div class="progress-bar" style="background:${t.c||'#888'};width:${pct}%"></div></div>
      <span class="wb" style="background:${wbg};color:${wc}">${w}/${mw}주차</span>
      <span style="font-size:9px;color:#8e8e93">주${l.freq}회</span>

}

// ── 출결 관리 ────────────────────────────────────────────
let _attView='list'; // 'list' | 'monthly'
let _attMonth='';

function rAtt(){
  if(!isAdm()){
    // 선생님: 기존 요일별 출석체크
    const isDanceT2=(gTi()===DTI);
    const TABS=[{id:0,l:'월'},{id:1,l:'화'},{id:2,l:'수'},{id:3,l:'목'},
      ...(!isDanceT2?[{id:4,l:'금'}]:[]),
      ...(isDanceT2?[{id:41,l:'금(댄)'}]:[]),
      {id:5,l:'토'}];
    let h=`<div class="chip-bar">`;TABS.forEach(tab=>{h+=`<button class="chip${selDay===tab.id?' on':''}" onclick="selDay=${tab.id};rAtt()">${tab.l}</button>`;});h+=`</div>`;
    const dates=DD[selDay]||[];const tio=T.map((_,i)=>i);
    const dayL=lessons.filter(l=>l.day===selDay&&l.type==='individual').sort((a,b)=>tio.indexOf(a.ti)-tio.indexOf(b.ti));
    if(!dayL.length){h+=`<div class="empty">이 요일 수업이 없습니다</div>`;document.getElementById('page').innerHTML=h;return;}
    let tp=0,ta=0,tm=0;
    dayL.forEach(l=>dates.forEach(d=>{const v=((att[l.ti]||{})[l.student]||{})[d]||'';if(v==='present')tp++;else if(v==='absent')ta++;else if(v==='makeup')tm++;}));
    h+=`<div class="stat-grid"><div class="stat-c"><div class="stat-n" style="color:#2E7D32">${tp}</div><div class="stat-l">출석</div></div><div class="stat-c"><div class="stat-n" style="color:#C00000">${ta}</div><div class="stat-l">결석</div></div><div class="stat-c"><div class="stat-n" style="color:#1565C0">${tm}</div><div class="stat-l">보강</div></div></div>
    <div class="att-wrap"><table class="at"><thead><tr><th style="text-align:left">학생</th><th>선생</th>`;
    dates.forEach(d=>h+=`<th>${d}</th>`);h+=`<th>출</th><th>결</th></tr></thead><tbody>`;
    dayL.forEach(l=>{const t=T[l.ti]||{};let pc=0,ac=0;h+=`<tr><td style="text-align:left;font-weight:600;white-space:nowrap">${l.student}</td><td style="color:${t.c||'#888'};font-weight:600;white-space:nowrap">${t.s||''}</td>`;
      dates.forEach(date=>{const v=((att[l.ti]||{})[l.student]||{})[date]||'';const dc=v==='present'?'#E8F5E9':v==='absent'?'#FFEBEE':v==='makeup'?'#E3F2FD':'';const tc=v==='present'?'#2E7D32':v==='absent'?'#C00000':v==='makeup'?'#1565C0':'';const lb=v==='present'?'출':v==='absent'?'결':v==='makeup'?'보':'';if(v==='present')pc++;if(v==='absent')ac++;h+=`<td><div class="mdot" style="background:${dc};color:${tc}">${lb}</div></td>`;});
      h+=`<td style="color:#2E7D32;font-weight:700">${pc}</td><td style="color:#C00000;font-weight:700">${ac}</td></tr>`;});
    h+=`</tbody></table></div>`;document.getElementById('page').innerHTML=h;
    return;
  }

  // 관리자: 탭 전환 (학생목록 | 월별출결)
  const now=new Date();
  if(!_attMonth) _attMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  let h=`<div style="display:flex;gap:0;margin:12px 12px 0;background:#f2f2f7;border-radius:10px;padding:3px">
    <button onclick="_attView='list';rAtt()" style="flex:1;padding:7px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:${_attView==='list'?'#fff':'transparent'};color:${_attView==='list'?'#C00000':'#8e8e93'};box-shadow:${_attView==='list'?'0 1px 3px rgba(0,0,0,.1)':'none'}">📋 학생 목록</button>
    <button onclick="_attView='monthly';rAtt()" style="flex:1;padding:7px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:${_attView==='monthly'?'#fff':'transparent'};color:${_attView==='monthly'?'#C00000':'#8e8e93'};box-shadow:${_attView==='monthly'?'0 1px 3px rgba(0,0,0,.1)':'none'}">📅 월별 출결</button>
  </div>`;

  if(_attView==='list'){
    // 기존 선생님별 학생 목록 - 통계에서 왔으면 뒤로가기 버튼 표시
    const fromStat=document.referrer===''||true; // 항상 표시
    h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 12px 4px">
      <button onclick="showView('stat')" style="background:none;border:none;font-size:13px;color:#8e8e93;cursor:pointer;padding:4px 8px;border-radius:8px;background:#f2f2f7;font-family:inherit">‹ 통계</button>
      <span style="font-size:12px;font-weight:700;color:#1c1c1e">출결 관리</span>
    </div>`;
    T.forEach((t,ti)=>{
      const myL=lessons.filter(l=>l.ti===ti&&l.type==='individual');
      const uniqS=[...new Map(myL.map(l=>[l.student,l])).values()];
      if(!uniqS.length) return;
      h+=`<div style="margin:10px 12px 4px;padding:10px 14px;background:${bg(t.c||'#888')};border-radius:12px 12px 0 0;border-left:3px solid ${t.c||'#888'}">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:28px;height:28px;border-radius:50%;background:${t.c||'#888'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">${t.s||''}</div>
          <div style="font-size:13px;font-weight:700;color:${t.c||'#888'}">${t.name||''}</div>
          <div style="font-size:11px;color:#8e8e93;margin-left:auto">${uniqS.length}명</div>
        </div>
      </div>
      <div style="margin:0 12px 4px;background:#fff;border-radius:0 0 12px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)">`;
      uniqS.forEach((l,i)=>{
        const attD=(att[ti]||{})[l.student]||{};
        const allD=Object.keys(attD);
        const present=allD.filter(d=>attD[d]==='present'||attD[d]==='makeup').length;
        const absent=allD.filter(d=>attD[d]==='absent').length;
        const maxW=l.maxWeek||4;
        const total=maxW*((l.freq||1)>=2?2:1);
        const pct=Math.min(100,Math.round(present/total*100));
        const border=i<uniqS.length-1?'border-bottom:.5px solid #f0f0f0':'';
        h+=`<div style="padding:10px 14px;${border};cursor:pointer;display:flex;align-items:center;gap:10px" onclick="_detailTi=${ti};_detailStudent='${l.student}';rStudentDetail()">
          <div style="width:32px;height:32px;border-radius:50%;background:${bg(t.c||'#888')};color:${t.c||'#888'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">${l.student[0]}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:#1c1c1e">${l.student} ${l.course==='입시'?'<span class="course-i">입시</span>':''}<span style="font-size:10px;color:#8e8e93;font-weight:400"> ${l.level||''} ${l.gender||''}</span></div>
            <div style="font-size:10px;color:#8e8e93;margin-top:2px">${DL[l.day]||''} ${l.time} · ${(l.freq||1)>=2?'주2회':'주1회'}</div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
              <div style="flex:1;height:4px;background:#f0f0f0;border-radius:2px"><div style="height:4px;background:${t.c||'#888'};border-radius:2px;width:${pct}%"></div></div>
              <span style="font-size:10px;color:#2E7D32;font-weight:600">${present}출</span>
              <span style="font-size:10px;color:#C00000;font-weight:600">${absent}결</span>
              <span style="font-size:10px;color:#8e8e93">${present}/${total}</span>
            </div>
          </div>
          <div style="font-size:16px;color:#ccc">›</div>
        </div>`;
      });
      h+=`</div>`;
    });
  } else {
    // 월별 출결 다운로드
    // 전체 출결 데이터에서 월 목록 추출
    const months=new Set();
    Object.values(att).forEach(byTeacher=>{
      Object.values(byTeacher).forEach(byStudent=>{
        Object.keys(byStudent).forEach(d=>{if(d.length>=7)months.add(d.slice(0,7));});
      });
    });
    // 현재 월도 추가
    months.add(_attMonth);
    const sortedMonths=[...months].sort().reverse();

    h+=`<div style="margin:12px 12px 0;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)">
      <div style="font-size:12px;font-weight:700;color:#1c1c1e;margin-bottom:10px">📅 월 선택</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">`;
    sortedMonths.forEach(m=>{
      const [y,mo]=m.split('-');
      h+=`<button onclick="_attMonth='${m}';rAtt()" style="padding:6px 12px;border-radius:8px;border:1.5px solid ${_attMonth===m?'#C00000':'#e5e5e5'};background:${_attMonth===m?'#fff5f5':'#fff'};color:${_attMonth===m?'#C00000':'#1c1c1e'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">${y}년 ${parseInt(mo)}월</button>`;
    });
    h+=`</div></div>`;

    // 선택 월 표시
    const [sy,sm]=_attMonth.split('-');
    h+=`<div style="margin:10px 12px 4px;font-size:13px;font-weight:700;color:#1c1c1e;padding:0 2px">${sy}년 ${parseInt(sm)}월 출결부</div>`;

    // 선생님별 다운로드 버튼
    T.forEach((t,ti)=>{
      const myL=lessons.filter(l=>l.ti===ti&&l.type==='individual');
      const uniqS=[...new Map(myL.map(l=>[l.student,l])).values()];
      if(!uniqS.length) return;
      h+=`<div style="margin:0 12px 8px;background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:28px;height:28px;border-radius:50%;background:${t.c||'#888'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">${t.s||''}</div>
            <div style="font-size:13px;font-weight:700;color:${t.c||'#888'}">${t.name||''} (${uniqS.length}명)</div>
          </div>
          <button onclick="downloadMonthlyAtt(${ti},'${_attMonth}')" style="background:#C00000;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">⬇ HTML 다운로드</button>
        </div>`;
      // 미리보기: 학생 이름 + 해당월 출석 요약
      uniqS.forEach(l=>{
        const attD=(att[ti]||{})[l.student]||{};

        h+=`<div style="display:flex;align-items:center;padding:5px 0;border-top:.5px solid #f5f5f5">

          <div style="display:flex;gap:4px;flex-wrap:wrap">`;
        mDates.forEach(d=>{
          const st=attD[d];

          const bg2=st==='present'?'#E8F5E9':st==='makeup'?'#E3F2FD':'#FFEBEE';
          h+=`<span style="font-size:10px;background:${bg2};color:${col};padding:1px 5px;border-radius:4px">${d.slice(5)} ${lab}</span>`;

        h+=`</div><div style="margin-left:auto;font-size:10px;color:#8e8e93;white-space:nowrap">${p}출${mk?` ${mk}보`:''}${ab?` ${ab}결`:''}</div></div>`;
      });
      h+=`</div>`;
    });
  }

  document.getElementById('page').innerHTML=h;
}

// ── 월별 출결부 다운로드 ──────────────────────────────────
function downloadMonthlyAtt(ti, month){
  const t=T[ti]||{};
  const myL=lessons.filter(l=>l.ti===ti&&l.type==='individual');
  const uniqS=[...new Map(myL.map(l=>[l.student,l])).values()];
  const [y,m]=month.split('-');
  const monthLabel=`${y}년 ${parseInt(m)}월`;

  let html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/>
  <title>${t.name||''} ${monthLabel} 출결부</title>
  <style>
    body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:12px;padding:20px;color:#1c1c1e;}
    h1{font-size:18px;margin-bottom:4px;}
    h2{font-size:14px;color:#C00000;margin:0 0 16px;}
    table{border-collapse:collapse;width:100%;margin-bottom:24px;}
    th{background:#f2f2f7;padding:7px 10px;border:1px solid #ddd;font-size:11px;white-space:nowrap;}
    td{padding:7px 10px;border:1px solid #ddd;font-size:11px;white-space:nowrap;}
    .present{background:#E8F5E9;color:#2E7D32;font-weight:700;text-align:center;}
    .makeup{background:#E3F2FD;color:#1565C0;font-weight:700;text-align:center;}
    .absent{background:#FFEBEE;color:#C00000;font-weight:700;text-align:center;}
    .name{font-weight:700;}
    .summary{color:#8e8e93;font-size:10px;}
    @media print{body{padding:10px;}}
  </style></head><body>
  <h1>부산뮤직 일광점 출결부</h1>
  <h2>${t.name||''} 선생님 · ${monthLabel}</h2>`;

  uniqS.forEach(l=>{
    const attD=(att[ti]||{})[l.student]||{};
    const mDates=Object.keys(attD).filter(d=>d.startsWith(month)).sort();
    const maxW=l.maxWeek||4;
    const total=maxW*((l.freq||1)>=2?2:1);
    let sess=0;

    html+=`<table>
      <thead>
        <tr>
          <th colspan="${mDates.length+3}" style="background:#${t.c?.slice(1)||'C00000'}22;color:#1c1c1e;text-align:left;font-size:12px">
            ${l.student} · ${l.course||''} · ${l.level||''} ${l.gender||''} · ${(l.freq||1)>=2?'주2회':'주1회'} · 총${total}차시
          </th>
        </tr>
        <tr>
          <th>차시</th>
          <th>날짜</th>
          <th>상태</th>
          <th>비고</th>
        </tr>
      </thead><tbody>`;

    mDates.forEach(date=>{
      const st=attD[date];
      const ok=st==='present'||st==='makeup';
      if(ok)sess++;
      const lab=st==='present'?'출석':st==='makeup'?'보강':st==='absent'?'결석':'-';
      const cls=st==='present'?'present':st==='makeup'?'makeup':st==='absent'?'absent':'';
      html+=`<tr>
        <td style="text-align:center;font-weight:700">${ok?sess+'차시':'-'}</td>
        <td>${date}</td>
        <td class="${cls}">${lab}</td>
        <td></td>
      </tr>`;
    });

    // 남은 차시
    for(let i=sess;i<total;i++){
      html+=`<tr>
        <td style="text-align:center;color:#ccc">${i+1}차시</td>
        <td style="color:#ccc">-</td>
        <td style="color:#ccc;text-align:center">예정</td>
        <td></td>
      </tr>`;
    }

    const present=mDates.filter(d=>attD[d]==='present').length;
    const makeup=mDates.filter(d=>attD[d]==='makeup').length;
    const absent=mDates.filter(d=>attD[d]==='absent').length;
    html+=`<tr style="background:#f9f9f9">
      <td colspan="4" class="summary">
        출석 ${present}회 · 보강 ${makeup}회 · 결석 ${absent}회 · 완료 ${sess}/${total}차시
      </td>
    </tr>
    </tbody></table>`;
  });

  html+=`<div style="margin-top:20px;font-size:10px;color:#8e8e93;border-top:1px solid #eee;padding-top:8px">
    출력일: ${new Date().toLocaleDateString('ko-KR')} · 부산뮤직 일광점
  </div></body></html>`;

  // 다운로드
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`${t.name||'선생님'}_${monthLabel}_출결부.html`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast(`⬇ ${t.name||''} ${monthLabel} 출결부 다운로드 완료`);
}

// ── 레이아웃 설정 적용 ──────────────────────────────────
function applyLayout(mode){
  document.body.classList.remove('force-landscape','force-portrait');
  if(mode==='landscape') document.body.classList.add('force-landscape');
  else if(mode==='portrait') document.body.classList.add('force-portrait');
  localStorage.setItem('bm_layout', mode||'auto');
}
// 앱 시작 시 저장된 레이아웃 적용
(function(){
  const m=localStorage.getItem('bm_layout');
  if(m&&m!=='auto')applyLayout(m);
  // 시간표 크기 적용
  const sz=localStorage.getItem('bm_tt_size');
  if(sz) applyTTSize(parseInt(sz));
})();

function applyTTSize(size){
  size = Math.min(20, Math.max(8, size));
  // 시간표 CSS 동적 적용
  let style = document.getElementById('_tt_size_style');
  if(!style){
    style = document.createElement('style');
    style.id = '_tt_size_style';
    document.head.appendChild(style);
  }
  style.textContent = `
    .tt{font-size:${size}px !important;}
    .lb,.lb-t{font-size:${size}px !important;}
    .gb{font-size:${Math.max(7,size-1)}px !important;}
    .tc{font-size:${Math.max(7,size-1)}px !important;}
    .tt th{font-size:${Math.max(7,size-1)}px !important;}
  `;
}

function setTTSize(size){
  size = Math.min(20, Math.max(8, size));
  localStorage.setItem('bm_tt_size', size);
  applyTTSize(size);
  rSet(); // 설정 화면 새로고침
}

// ── 통계 학생 명단 ───────────────────────────────────────
function showStatList(filterKey){
  const indiv=lessons.filter(l=>l.type==='individual'&&l.ti!==DTI&&l.day!==41);
  const seenPair=new Set();
  let filtered=[];

  if(filterKey==='w1'){
    // 주1회: student+ti 기준
    const seen=new Set();
    indiv.filter(l=>(l.freq||1)<2).forEach(l=>{const k=l.student+'_'+l.ti;if(!seen.has(k)){seen.add(k);filtered.push(l);}});
  } else if(filterKey==='w2'){
    // 주2회: student 기준, pairId 쌍 한번만
    const seenS=new Set();
    indiv.filter(l=>(l.freq||1)>=2).forEach(l=>{
      if(!seenS.has(l.student)){seenS.add(l.student);filtered.push(l);}
    });
  } else if(filterKey==='ips'){
    // 입시: student 기준 (중복과목 1명)
    const seen=new Set();
    indiv.filter(l=>l.course==='입시').forEach(l=>{if(!seen.has(l.student)){seen.add(l.student);filtered.push(l);}});
  } else if(filterKey==='hby'){
    // 취미+전문: student 기준
    const seen=new Set();
    indiv.filter(l=>l.course==='취미'||l.course==='전문').forEach(l=>{if(!seen.has(l.student)){seen.add(l.student);filtered.push(l);}});
  } else {
    // 전체: student 기준
    const seen=new Set();
    indiv.forEach(l=>{if(!seen.has(l.student)){seen.add(l.student);filtered.push(l);}});
  }

  const el=document.getElementById('stat-list');
  if(!el)return;
  if(el._key===filterKey&&el.innerHTML!==''){el.innerHTML='';el._key=null;return;}
  el._key=filterKey;

  const labels={'all':'전체','w1':'주 1회','w2':'주 2회','ips':'입시','hby':'취미'};
  let h=`<div style="margin:0 12px 12px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)">
    <div style="padding:10px 14px;background:#f9f9f9;border-bottom:1px solid #eee;display:flex;align-items:center">
      <div style="font-size:12px;font-weight:700;flex:1">${labels[filterKey]||''} 학생 (${filtered.length}명)</div>
      <button onclick="const el=document.getElementById('stat-list');el.innerHTML='';el._key=null;" style="background:none;border:none;font-size:18px;color:#8e8e93;cursor:pointer;padding:0;line-height:1">✕</button>
    </div>`;

  if(filterKey==='ips'){
    // 입시: 입시담당 선생님(ipsTeacher) 기준으로 그룹핑
    const byIpsTi={};
    filtered.forEach(l=>{
      // ipsTeacher 있으면 그 선생님, 없으면 수업 선생님
      const key=l.ipsTeacher!==undefined?l.ipsTeacher:l.ti;
      if(!byIpsTi[key])byIpsTi[key]=[];
      byIpsTi[key].push(l);
    });
    Object.keys(byIpsTi).sort((a,b)=>a-b).forEach(ti=>{
      const t=T[ti]||{};
      h+=`<div style="padding:8px 14px;border-bottom:.5px solid #f0f0f0">
        <div style="font-size:10px;color:${t.c||'#888'};font-weight:700;margin-bottom:4px">🎓 입시담당: ${t.name||''}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">`;
      byIpsTi[ti].forEach(l=>{
        const tLesson=T[l.ti]||{};
        h+=`<span style="font-size:11px;background:${bg(t.c||'#888')};color:${t.c||'#888'};padding:2px 8px;border-radius:10px;font-weight:600" title="수업: ${tLesson.name||''}">${l.student}</span>`;
      });
      h+=`</div></div>`;
    });
  } else {
    // 일반: 수업 선생님 기준
    const byTi={};
    filtered.forEach(l=>{if(!byTi[l.ti])byTi[l.ti]=[];byTi[l.ti].push(l);});
    Object.keys(byTi).sort((a,b)=>a-b).forEach(ti=>{
      const t=T[ti]||{};
      h+=`<div style="padding:8px 14px;border-bottom:.5px solid #f0f0f0">
        <div style="font-size:10px;color:${t.c||'#888'};font-weight:700;margin-bottom:4px">${t.name||''}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">`;
      byTi[ti].forEach(l=>{h+=`<span style="font-size:11px;background:${bg(t.c||'#888')};color:${t.c||'#888'};padding:2px 8px;border-radius:10px;font-weight:600">${l.student}</span>`;});
      h+=`</div></div>`;
    });
  }
  h+=`</div>`;
  el.innerHTML=h;
  setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

function changePw(key){
  const old=document.getElementById('pw-old').value;
  const nw=document.getElementById('pw-new').value;
  const nw2=document.getElementById('pw-new2').value;
  const msg=document.getElementById('pw-msg');
  if(old !== (PASSWORDS[key]||'1234')){msg.textContent='현재 비밀번호가 틀렸습니다';return;}
  if(!nw||nw.length<4){msg.textContent='4자리 이상 입력해 주세요';return;}
  if(nw!==nw2){msg.textContent='새 비밀번호가 일치하지 않습니다';return;}
  PASSWORDS[key]=nw;
  if(window._db) window._db.collection('meta').doc('passwords').set(PASSWORDS).catch(()=>{});
  msg.style.color='#2E7D32';msg.textContent='✅ 비밀번호가 변경됐습니다!';
  setTimeout(()=>{document.getElementById('pw-old').value='';document.getElementById('pw-new').value='';document.getElementById('pw-new2').value='';},500);
}

function resetAllPw(){
  if(!confirm('모든 비밀번호를 0000으로 초기화할까요?'))return;
  Object.keys(PASSWORDS).forEach(k=>PASSWORDS[k]='0000');
  if(window._db) window._db.collection('meta').doc('passwords').set(PASSWORDS).catch(()=>{});
  showToast('✅ 모든 비밀번호가 0000으로 초기화됐습니다');
}

// ── 통계 페이지 ──────────────────────────────────────────
function rStat(){
  const indiv=lessons.filter(l=>l.type==='individual'&&l.ti!==DTI&&l.day!==41);
  // 전체: student+ti 기준 (같은 학생 다른 선생님은 각각)
  const uniq=arr=>new Set(arr.map(l=>l.student+'_'+l.ti)).size;
  // 고유학생: student만 기준 (중복과목 1명)
  const uniqS=arr=>new Set(arr.map(l=>l.student)).size;
  const total=uniqS(indiv);
  const w1=uniq(indiv.filter(l=>(l.freq||1)===1));
  const w2=uniqS(indiv.filter(l=>(l.freq||1)>=2));
  const ips=uniqS(indiv.filter(l=>l.course==='입시'));
  const hby=uniqS(indiv.filter(l=>l.course==='취미'||l.course==='전문'));
  // 주간 총 수업시간: 개인레슨만, 단체수업·댄스 제외
  // 주1회=1시간, 주2회=2시간, pairId 중복만 제거
  const indivOnly=lessons.filter(l=>l.type==='individual'&&l.ti!==DTI&&l.day!==41);
  const seenPair=new Set();
  let totalHrs=0;
  indivOnly.forEach(l=>{
    // pairId가 있으면 쌍 중 하나만 계산 (주2회 = 2시간)
    if(l.pairId){
      const pairKey=[l._id,l.pairId].sort().join('_');
      if(!seenPair.has(pairKey)){
        seenPair.add(pairKey);
        totalHrs+=2; // 주2회 = 2시간
      }
    } else {
      totalHrs+=1;
    }
  });
  const card=(icon,label,val,color,filterKey)=>`<div style="background:#fff;border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;active:opacity:.8" onclick="showStatList('${filterKey}')">
    <div style="font-size:26px">${icon}</div>
    <div><div style="font-size:11px;color:#8e8e93">${label}</div>
    <div style="font-size:22px;font-weight:800;color:${color}">${val}</div></div>
  </div>`;
  let h=`<div class="sec-lbl" style="padding:16px 16px 8px;font-size:13px;font-weight:700">📊 수강 현황</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px">
    ${card('👥','총 수강생',total+'명','#C00000','all')}
    ${card('⏰','주간 총 수업',totalHrs+'시간','#1565C0','all')}
    ${card('1️⃣','주 1회',w1+'명','#2E7D32','w1')}
    ${card('2️⃣','주 2회',w2+'명','#6A1B9A','w2')}
    ${card('🎓','입시',ips+'명','#E53935','ips')}
    ${card('🎵','취미',hby+'명','#F57C00','hby')}
  </div>
  <div id="stat-list"></div>
  <div style="padding:0 12px 6px;font-size:11px;font-weight:700;color:#8e8e93">선생님별 담당</div>`;
  T.forEach((t,i)=>{
    if(i===DTI)return;
    const myL=lessons.filter(l=>l.ti===i&&l.type==='individual');
    if(!myL.length)return;

    // 총 학생수 (중복 제외)
    const uniqStudents=new Set(myL.map(l=>l.student)).size;
    if(!uniqStudents)return;

    // 총 수업시간 (중복 계산, 주2회=2시간, pairId 쌍 한번만)
    const seenP=new Set();
    let hrs=0;
    myL.forEach(l=>{
      if(l.pairId){
        const pk=[l._id,l.pairId].sort().join('_');
        if(!seenP.has(pk)){seenP.add(pk);hrs+=2;}
      } else { hrs+=1; }
    });

    // 입시 학생수 - ipsTeacher 기준 (없으면 수업 선생님 ti 기준)

function rAlert(){
  const today = new Date();
  const dayIdx = today.getDay(); // 0=일,1=월...6=토
  const dayMap = {1:0,2:1,3:2,4:3,5:4,6:5};
  const todayDayKey = dayMap[dayIdx];
  const isDanceT2=(gTi()===DTI),isAdV2=isAdm();
  const TABS=[{id:0,l:'월'},{id:1,l:'화'},{id:2,l:'수'},{id:3,l:'목'},
    ...(isAdV2||!isDanceT2?[{id:4,l:'금'}]:[]),
    ...(isAdV2||isDanceT2?[{id:41,l:'금(댄)'}]:[]),
    {id:5,l:'토'}];
  let h=`<div class="sec-lbl">📣 출석 미등록 알림</div>
  <div class="chip-bar">`;
  TABS.forEach(tab=>{h+=`<button class="chip${selDay===tab.id?' on':''}" onclick="selDay=${tab.id};rAlert()">${tab.l}</button>`;});
  h+=`</div>`;

  const dates=DD[selDay]||[];
  const tiOrder=T.map((_,i)=>i);
  const dayL=lessons.filter(l=>l.day===selDay&&l.type==='individual').sort((a,b)=>tiOrder.indexOf(a.ti)-tiOrder.indexOf(b.ti));

  if(!dayL.length){h+=`<div class="empty">이 요일 수업이 없습니다</div>`;document.getElementById('page').innerHTML=h;return;}

  // 미등록자 찾기
  const unregistered={};
  dayL.forEach(l=>{
    dates.forEach(date=>{
      const v=((att[l.ti]||{})[l.student]||{})[date]||'';
      if(!v){ // 출석 미등록
        const tName=T[l.ti]?.name||'';
        if(!unregistered[tName])unregistered[tName]={ti:l.ti,dates:{}};
        if(!unregistered[tName].dates[date])unregistered[tName].dates[date]=[];
        unregistered[tName].dates[date].push(l.student);
      }
    });
  });

  const teachers=Object.keys(unregistered);
  if(!teachers.length){
    h+=`<div class="empty">✅ 모든 출석이 등록되어 있습니다</div>`;
    document.getElementById('page').innerHTML=h;return;
  }

  h+=`<div class="nbar" style="margin-bottom:8px">
    <div class="nt">⚠️ 출석 미등록 선생님 (${teachers.length}명)</div>`;
  teachers.forEach(tName=>{
    const info=unregistered[tName];
    h+=`<div class="nr">• ${tName} — ${Object.keys(info.dates).map(d=>`${d}(${info.dates[d].length}명)`).join(', ')}</div>`;
  });
  h+=`</div>`;

  // 알림 메시지 미리보기
  h+=`<div class="li" style="margin-bottom:8px">
    <div style="font-size:12px;font-weight:700;margin-bottom:8px">📱 알림 메시지</div>`;
  teachers.forEach(tName=>{
    const info=unregistered[tName];
    const t=T[info.ti]||{};
    const msg=Object.keys(info.dates).map(d=>`${d}: ${info.dates[d].join(', ')}`).join('\n');
    h+=`<div style="background:${bg(t.c||'#888')};border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid ${t.c||'#888'}">
      <div style="font-size:11px;font-weight:700;color:${t.c||'#888'};margin-bottom:4px">${tName}</div>
      <div style="font-size:10px;color:#555;white-space:pre-line">출석 미등록 학생:\n${msg}</div>
      <button onclick="sendAlert('${tName}',\`${msg}\`)" style="margin-top:8px;background:${t.c||'#888'};color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;width:100%">
        📤 ${tName}에게 알림 보내기
      </button>
    </div>`;
  });
  h+=`</div>`;

  // 전체 알림 보내기 버튼
  h+=`<button class="add-btn" onclick="sendAllAlerts(${JSON.stringify(unregistered).replace(/"/g,'&quot;')})">
    📣 전체 선생님에게 알림 보내기 (${teachers.length}명)
  </button>`;

  document.getElementById('page').innerHTML=h;
}

// 알림 기록 저장
let alertHistory=[];

function sendAlert(teacherName, msg){
  const time=new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  alertHistory.unshift({to:teacherName,msg,time,sent:true});
  // 실제 알림은 카카오/문자 연동 필요 - 현재는 클립보드 복사
  const fullMsg=`[부산뮤직 일광점] ${teacherName} 선생님\n출석 미등록 학생이 있습니다:\n${msg}\n\n출석체크 앱에서 확인해 주세요.`;
  if(navigator.clipboard){
    navigator.clipboard.writeText(fullMsg).then(()=>{
      showToast(`✅ ${teacherName}에게 보낼 메시지가 클립보드에 복사됐습니다`);
    }).catch(()=>showToast(`📋 메시지: ${fullMsg}`));
  } else {
    alert(`📋 복사해서 보내세요:\n\n${fullMsg}`);
  }
}

function sendAllAlerts(unregistered){
  if(!confirm(`${Object.keys(unregistered).length}명의 선생님에게 알림을 보낼까요?`))return;
  Object.keys(unregistered).forEach(tName=>{
    const info=unregistered[tName];
    const msg=Object.keys(info.dates).map(d=>`${d}: ${info.dates[d].join(', ')}`).join('\n');
    sendAlert(tName,msg);
  });
}

function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;z-index:999;white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._to);t._to=setTimeout(()=>t.style.display='none',3000);
}

    selDate=dates.includes(todayStr)?todayStr:dates[dates.length-1];
  }
  h+=`<div style="padding:4px 12px 2px;font-size:10px;color:#8e8e93">날짜 선택</div><div class="chip-bar" style="padding-top:4px;padding-bottom:6px">`;

  let tp=0,ta=0,tm=0;dayL.forEach(l=>{const v=((att[ti]||{})[l.student]||{})[selDate]||'';if(v==='present')tp++;else if(v==='absent')ta++;else if(v==='makeup')tm++;});

// ── 출석 ────────────────────────────────────────────────
function setAtt(ti,s,date,st){
  if(!att[ti])att[ti]={};
  if(!att[ti][s])att[ti][s]={};
  if(att[ti][s][date]===st){
    delete att[ti][s][date];
    if(window._db) fbSaveAtt(ti,s,date,null);
  } else {
    att[ti][s][date]=st;
    if(window._db) fbSaveAtt(ti,s,date,st);
  }
  rMyDay();
}

function openAdd(day,time,ti,forceType){
  try{
    editIdx=null;
    const ltitle=document.getElementById('ltitle');
    if(ltitle) ltitle.textContent='학생 관리';
    const bdel=document.getElementById('bdel');if(bdel)bdel.style.display='none';
    const bsave=document.getElementById('bsave');if(bsave)bsave.style.display='';
    const bedit=document.getElementById('bedit');if(bedit)bedit.style.display='none';
    ['mstud','mlevel','mmemo','mgrp','mgrpstud'].forEach(id=>{
      const el=document.getElementById(id);if(el)el.value='';
    });
    const today=new Date().toISOString().split('T')[0];
    const ms=document.getElementById('mstart');if(ms)ms.value=today;
    const tp=forceType||'individual';
    const mt=document.getElementById('mtype');if(mt)mt.value=tp;
    toggleType(tp);
    // toggleType 후 fillT 호출 (grpf 표시된 후에 mteachG 채워짐)
    fillT(ti!==null&&ti!==undefined?parseInt(ti):gTi());
    const mc=document.getElementById('mcourse');if(mc)mc.value='취미';
    const fq=document.getElementById('mfreq');if(fq){fq.value='1';toggleFreq('1');}
    const mw=document.getElementById('mmaxw');if(mw)mw.value='4';
    const cs=document.getElementById('mcurrsession');if(cs)cs.value='0';
    const mg=document.getElementById('mgender');if(mg)mg.value='';
    // fillT는 위에서 이미 호출됨
    if(day!==null&&day!==undefined){
      const md=document.getElementById('mday');if(md)md.value=day;
      const md2a=document.getElementById('mday2a');if(md2a)md2a.value=day;
      const mdG=document.getElementById('mdayG');if(mdG)mdG.value=day;
    }
    // 댄스조(DTI)면 금댄(41) 자동 설정
    const curTi=ti!==null&&ti!==undefined?parseInt(ti):gTi();
    if(curTi===DTI){
      const mdG=document.getElementById('mdayG');if(mdG)mdG.value=41;
    }
    if(time!==null&&time!==undefined){
      const mti=document.getElementById('mtime');if(mti)mti.value=time;
      const mt2a=document.getElementById('mtime2a');if(mt2a)mt2a.value=time;
    }
    document.getElementById('mlsn').classList.add('on');
  }catch(e){
    console.error('openAdd 오류:', e);
    document.getElementById('mlsn').classList.add('on');
  }
}
function openEdit(idx){
  const l=lessons[idx],myTi=gTi();
  if(!isLoginAdm()&&myTi!==l.ti)return;
  editIdx=idx;
  document.getElementById('ltitle').textContent=l.type==='group'?'단체수업 수정':'학생 관리';
  document.getElementById('bdel').style.display='';
  document.getElementById('bsave').style.display='none';
  document.getElementById('bedit').style.display='';
  document.getElementById('mtype').value=l.type||'individual';

    const mgrp=document.getElementById('mgrp');if(mgrp)mgrp.value=l.groupname||'';
    const mdayG=document.getElementById('mdayG');if(mdayG)mdayG.value=l.day||0;
    const mtimeG=document.getElementById('mtimeG');if(mtimeG)mtimeG.value=l.time||'15:00';
    // 선생님 드롭다운 채우기
    const selG=document.getElementById('mteachG');
    if(selG){
      selG.innerHTML='';
      T.forEach((t,i)=>{
        const opt=document.createElement('option');
        opt.value=i;opt.textContent=t.name+' ('+t.sub+')';
        if(i===l.ti)opt.selected=true;
        selG.appendChild(opt);
      });

  } else {
    document.getElementById('mstud').value=l.student||'';

    const ipsBox=document.getElementById('ips-teacher-box');
    if(ipsBox)ipsBox.style.display=(l.course==='입시')?'':'none';
    setTimeout(()=>{
      const ipsEl=document.getElementById('mipsteach');
      if(!ipsEl)return;
      // 이 레슨 또는 같은 학생의 다른 레슨에서 ipsTeacher 찾기
      const ipsVal=l.ipsTeacher!==undefined?l.ipsTeacher:
        lessons.find(ll=>ll.student===l.student&&ll.course==='입시'&&ll.ipsTeacher!==undefined)?.ipsTeacher;
      ipsEl.value = ipsVal!==undefined ? ipsVal : '';
    },50);
    document.getElementById('mlevel').value=l.level||'';
    // 입시면 선생님 선택 강조
    const tcEl=document.getElementById('mteach');
    if(tcEl){tcEl.style.outline=(l.course==='입시')?'2px solid #C00000':'';tcEl.style.background=(l.course==='입시')?'#fff5f5':'';}
    const fv=String(l.freq||1);
    const fqEl=document.getElementById('mfreq');if(fqEl)fqEl.value=fv;
    toggleFreq(fv);
    const mgEl=document.getElementById('mgender');if(mgEl)mgEl.value=l.gender||'';
    document.getElementById('mmaxw').value=l.maxWeek||4;
    const csEl=document.getElementById('mcurrsession');if(csEl)csEl.value=l.currSession||0;
    if(fv==='2'){
      const d2a=document.getElementById('mday2a');if(d2a)d2a.value=l.day||0;
      const t2a=document.getElementById('mtime2a');if(t2a)t2a.value=l.time||'15:00';
      const d2b=document.getElementById('mday2b');if(d2b)d2b.value=l.day2||0;
      const t2b=document.getElementById('mtime2b');if(t2b)t2b.value=l.time2||'15:00';
    }
    document.getElementById('mstart').value=l.startDate||'';
    document.getElementById('mmemo').value=l.memo||'';
    fillT(l.ti);
    const md=document.getElementById('mday');if(md)md.value=l.day;
    const mt=document.getElementById('mtime');if(mt)mt.value=l.time;
  }
  document.getElementById('mlsn').classList.add('on');
}
function saveLsn(){
  if(window._saveLsn){ window._saveLsn(); return; }
  const type=document.getElementById('mtype').value;
  const ti=parseInt(document.getElementById('mteach').value);
  let obj;
  if(type==='group'){
    const gn=document.getElementById('mgrp').value.trim();
    if(!gn){alert('수업명을 입력해 주세요');return;}
    const dG=parseInt(document.getElementById('mdayG')?.value||document.getElementById('mday').value)||0;
    const tG=document.getElementById('mtimeG')?.value||document.getElementById('mtime').value||'15:00';
    obj={type:'group',day:dG,time:tG,ti,groupname:gn};
  } else {
    const s=document.getElementById('mstud').value.trim();
    if(!s){alert('학생 이름을 입력해 주세요');return;}
    const freq=parseInt(document.getElementById('mfreq').value)||1;
    let lday, ltime, day2, time2;
    if(freq===2){
      lday=parseInt(document.getElementById('mday2a')?.value)||0;
      ltime=document.getElementById('mtime2a')?.value||'15:00';
      day2=parseInt(document.getElementById('mday2b')?.value)||0;
      time2=document.getElementById('mtime2b')?.value||'15:00';
    } else if(freq===0){
      const sd=document.getElementById('mshortdate')?.value;
      lday=sd?new Date(sd).getDay():0;
      ltime=document.getElementById('mtimeS')?.value||'15:00';
    } else {
      lday=parseInt(document.getElementById('mday')?.value)||0;
      ltime=document.getElementById('mtime')?.value||'15:00';
    }
    obj={type:'individual',day:lday,time:ltime,ti,student:s,
      course:document.getElementById('mcourse').value,
      level:document.getElementById('mlevel').value.trim(),
      gender:document.getElementById('mgender')?.value||'',
      freq:freq,
      ...(day2!==undefined?{day2,time2}:{}),
      maxWeek:parseInt(document.getElementById('mmaxw').value)||4,
      currSession:parseInt(document.getElementById('mcurrsession')?.value)||0,
      startDate:document.getElementById('mstart').value,
      memo:document.getElementById('mmemo').value.trim()};
  }
  const id=(editIdx!==null&&lessons[editIdx]?._id)?lessons[editIdx]._id:('L'+Date.now());
  closeLsn();
  if(window._db){
    const {_id,...data}={...obj,_id:id};
    window._db.collection('lessons').doc(id).set(data)
      .then(()=>{showToast('✅ 저장됐습니다');updCnt();})
      .catch(e=>showToast('❌ 저장 실패: '+e.message));
  } else {
    if(editIdx!==null)lessons[editIdx]=obj;else lessons.push(obj);
    updCnt();
  }
}
function delLsn(){
  if(window._delLsn){ window._delLsn(); return; }
  if(editIdx===null)return;
  if(!confirm('이 수업을 삭제할까요?'))return;
  const l=lessons[editIdx];
  closeLsn();
  if(window._db && l?._id){
    window._db.collection('lessons').doc(l._id).delete()
      .then(()=>{showToast('🗑 삭제됐습니다');updCnt();})
      .catch(e=>showToast('❌ 삭제 실패: '+e.message));
  } else {
    lessons.splice(editIdx,1);updCnt();
  }
}
function closeLsn(){document.getElementById('mlsn').classList.remove('on');editIdx=null;}
function fillT(selectedTi){
  ['mteach','mteachG'].forEach(selId=>{
    const sel=document.getElementById(selId);if(!sel)return;
    sel.innerHTML='';
    T.forEach((t,i)=>{
      const opt=document.createElement('option');
      opt.value=i;opt.textContent=t.name;
      if(selectedTi!==null&&selectedTi!==undefined&&i===parseInt(selectedTi))opt.selected=true;
      sel.appendChild(opt);
    });
  });
  // 입시담당 드롭다운
  const ipsSel=document.getElementById('mipsteach');

    ipsSel.innerHTML='<option value="">선택 안함</option>';
    T.forEach((t,i)=>{
      const opt=document.createElement('option');
      opt.value=i;opt.textContent=t.name;
      ipsSel.appendChild(opt);
    });
  }
}

let PASSWORDS = {

function buildLoginList(){
  const list = document.getElementById('login-list');
  const fallback = document.getElementById('login-fallback');
  if(!list) return;

  list.innerHTML = '';

  // 관리자 버튼
  const adminBtn = document.createElement('button');
  adminBtn.className = 'login-btn';
  adminBtn.id = 'login-btn-admin';
  adminBtn.innerHTML = `<div class="login-av" style="background:rgba(192,0,0,0.09);color:#C00000">관</div>
    <div class="login-info"><div class="login-name">관리자</div><div class="login-sub">원장 / 부원장</div></div>
    <span style="font-size:16px;color:#ccc">›</span>`;
  adminBtn.onclick = () => selectLogin('admin');
  list.appendChild(adminBtn);

  // 구분선
  const div = document.createElement('div');
  div.style.cssText = 'border-top:.5px solid #e5e5e5;margin:4px 0';
  list.appendChild(div);

  // 선생님 목록
  T.forEach((t,i)=>{
    const btn = document.createElement('button');
    btn.className = 'login-btn';
    btn.id = `login-btn-${i}`;

    btn.innerHTML = `<div class="login-av" style="background:${bgColor};color:${t.c}">${t.s}</div>
      <div class="login-info"><div class="login-name">${t.name}</div><div class="login-sub">${t.sub}</div></div>
      <span style="font-size:16px;color:#ccc">›</span>`;
    btn.onclick = () => selectLogin(String(i));
    list.appendChild(btn);
  });

  // list가 채워지면 fallback 숨기기, 안 채워지면 fallback 표시
  if(list.children.length > 0){
    if(fallback) fallback.style.display = 'none';
  } else {
    if(fallback) fallback.style.display = 'block';
  }

function selectLogin(key){
  selLoginKey = key;
  document.querySelectorAll('.login-btn').forEach(b=>b.classList.remove('selected'));
  const btnEl = document.getElementById(key==='admin'?'login-btn-admin':`login-btn-${key}`);
  if(btnEl) btnEl.classList.add('selected');
  const pw = document.getElementById('pw-wrap');
  if(pw) pw.style.display = 'block';
  const sub = document.getElementById('login-submit');
  if(sub) sub.style.display = '';
  const inp = document.getElementById('pw-input');
  if(inp){ inp.value=''; inp.focus(); }
  const err = document.getElementById('login-err');
  if(err) err.textContent='';
}

function doLogin(){
  const pw = document.getElementById('pw-input').value;
  const correct = PASSWORDS[selLoginKey] || '1234';
  if(pw !== correct){
    document.getElementById('login-err').textContent = '비밀번호가 틀렸습니다';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
    return;
  }
  // 로그인 상태 저장
  sessionStorage.setItem('bm_loginKey', selLoginKey);
  // 로그인 상태 유지 체크시 localStorage에도 저장
  const keep = document.getElementById('keep-login')?.checked;
  if(keep){
    localStorage.setItem('bm_persistKey', selLoginKey);
  } else {
    localStorage.removeItem('bm_persistKey');
  }
  _applyLogin(selLoginKey);
}

function _applyLogin(key){
  selLoginKey = key;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  loginRole = key === 'admin' ? 'admin' : key;
  role = loginRole;
  const name = key === 'admin' ? '관리자' : T[parseInt(key)]?.name || '';
  document.getElementById('logout-btn').textContent = name + ' · 로그아웃';
  if(isAdm()){
    document.getElementById('teacher-switcher').style.display = '';
    buildSwitcherList();
    document.getElementById('switcher-label').textContent = '선생님 선택';
  } else {
    document.getElementById('teacher-switcher').style.display = 'none';
  }
  buildTabs();
  showView(isAdm() ? 'tt' : 'my-day');
}

    const sessToDate={}; // 차시번호 → date
    const dateToSess={}; // date → 차시번호
    sortedDates.forEach(d=>{
      const st=attData[d];
      if(st==='present'||st==='makeup'){
        sn++;
        sessToDate[sn]=d;
        dateToSess[d]=sn;
      }
    });

    // 결석 날짜 (차시 번호 없음)
    const absentDates=sortedDates.filter(d=>attData[d]==='absent');

    // 총 차시 칸 = totalSession
    // 각 칸에는 출석/보강 날짜를 순서대로 배치
    // 결석은 별도 표시
    const slots=Array.from({length:totalSession},(_,i)=>i+1);

    h+=`<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 4px">
    <table style="border-collapse:collapse;font-size:11px;white-space:nowrap">
    <thead><tr>`;

    // 헤더: 1차~N차
    let prevMonth='';
    slots.forEach(s=>{
      const date=sessToDate[s]||'';
      const month=date?date.slice(0,7):'';
      const bl=(month&&month!==prevMonth&&prevMonth)?'border-left:2.5px solid #999':'';
      if(month&&month!==prevMonth) prevMonth=month;
      h+=`<th style="padding:5px 6px;text-align:center;color:${t.c||'#888'};font-weight:700;min-width:46px;${bl}">${s}차</th>`;
    });
    h+=`</tr></thead><tbody>`;

    // 날짜 행 - 클릭하면 날짜 변경
    h+=`<tr>`;
    prevMonth='';
    slots.forEach(s=>{
      const date=sessToDate[s]||'';
      const month=date?date.slice(0,7):'';
      const bl=(month&&month!==prevMonth&&prevMonth)?'border-left:2.5px solid #999':'';
      if(month&&month!==prevMonth) prevMonth=month;
      h+=`<td style="padding:2px 4px;text-align:center;${bl}">
        <span style="font-size:10px;color:#1565C0;cursor:pointer;font-weight:600"
          onclick="showDatePop(event,${ti},'${studentName}','${date}')">${date?date.slice(5):'✏'}</span>
      </td>`;
    });
    h+=`</tr>`;

    // 출결 행 - 클릭 시 출/보/결 선택 팝업
    h+=`<tr>`;
    prevMonth='';
    slots.forEach(s=>{
      const date=sessToDate[s]||'';
      const st=date?attData[date]:'';
      const month=date?date.slice(0,7):'';
      const bl=(month&&month!==prevMonth&&prevMonth)?'border-left:2.5px solid #999':'';
      if(month&&month!==prevMonth) prevMonth=month;
      const lab=st==='present'?'출':st==='makeup'?'보':st==='absent'?'결':'';
      const col=st==='present'?'#2E7D32':st==='makeup'?'#1565C0':st==='absent'?'#C00000':'#aaa';
      const bg2=st==='present'?'#E8F5E9':st==='makeup'?'#E3F2FD':st==='absent'?'#FFEBEE':'#f5f5f5';
      h+=`<td style="padding:4px 4px;text-align:center;${bl}">
        <span style="display:inline-block;min-width:28px;padding:4px 2px;background:${bg2};color:${col};border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;border:1.5px solid ${col}30"
          onclick="showAttPop(event,${ti},'${studentName}','${date||''}','${st}',${s})">${lab||'○'}</span>
      </td>`;
    });
    h+=`</tr>`;

    if(absentDates.length){
      h+=`<tr><td colspan="${totalSession}" style="padding:5px 4px;font-size:10px;color:#C00000;text-align:left">
        결석: ${absentDates.map(d=>`<span style="cursor:pointer" onclick="showAttPop(event,${ti},'${studentName}','${d}','absent',0)">${d.slice(5)}</span>`).join(', ')}
      </td></tr>`;
    }

    h+=`</tbody></table></div>`;

    h+=`<div style="padding:4px 14px 12px;font-size:11px;color:#8e8e93;display:flex;gap:10px">
      <span style="color:#2E7D32;font-weight:600">출석 ${allDates.filter(d=>attData[d]==='present').length}</span>
      <span style="color:#1565C0;font-weight:600">보강 ${allDates.filter(d=>attData[d]==='makeup').length}</span>
      <span style="color:#C00000;font-weight:600">결석 ${absentDates.length}</span>
      <span style="margin-left:auto">완료 ${sn}/${totalSession}차시</span>
    </div>`;
  }
  h+=`</div>`;
  document.getElementById('page').innerHTML=h;
}

function showDatePop(e, ti, student, oldDate){

  const pop=document.createElement('div');
  pop.id='_date_pop';
  pop.style.cssText=`position:fixed;z-index:9999;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:12px;min-width:200px`;

  const today=new Date().toISOString().slice(0,10);
  pop.innerHTML=`
    <div style="font-size:11px;color:#8e8e93;margin-bottom:8px">날짜 ${oldDate?'변경':'입력'}</div>
    <input type="date" id="_pop_dt" value="${oldDate||today}"
      style="width:100%;background:#f2f2f7;border:none;border-radius:10px;padding:10px;font-size:14px;font-family:inherit;box-sizing:border-box;color:#1c1c1e"/>

    </div>`;

  const rect=e.target.getBoundingClientRect();
  let left=rect.left, top=rect.bottom+6;
  if(left+210>window.innerWidth) left=window.innerWidth-218;
  if(top+130>window.innerHeight) top=rect.top-138;
  pop.style.left=left+'px';
  pop.style.top=top+'px';
  document.body.appendChild(pop);

  // 달력 자동 열기
  setTimeout(()=>{const inp=document.getElementById('_pop_dt');if(inp)inp.showPicker?.();},50);

function confirmDatePop(ti, student, oldDate){
  const newDate=document.getElementById('_pop_dt')?.value;
  const pop=document.getElementById('_date_pop');
  if(pop) pop.remove();
  if(!newDate) return;
  if(newDate===oldDate) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(newDate)){alert('날짜 형식이 올바르지 않습니다');return;}

  if(oldDate){
    // 기존 날짜 상태 이전
    const oldSt=((att[ti]||{})[student]||{})[oldDate];
    if(oldSt){
      setAtt(ti,student,newDate,oldSt);
      if(att[ti]&&att[ti][student]) delete att[ti][student][oldDate];
      if(window._db) fbSaveAtt(ti,student,oldDate,null);
    }
  } else {
    setAtt(ti,student,newDate,'present');
  }
  setTimeout(()=>rStudentDetail(),200);
}

// 출결 상태 순환 (출석→보강→결석→삭제)
function cycleAtt(ti,student,date,cur){
  const next=cur==='present'?'makeup':cur==='makeup'?'absent':cur==='absent'?null:'present';
  if(next){
    setAtt(ti,student,date,next);
  } else {
    // 삭제 (null = 기록 제거)
    if(!att[ti])att[ti]={};
    if(!att[ti][student])att[ti][student]={};
    delete att[ti][student][date];
    if(window._db) fbSaveAtt(ti,student,date,null);
  }
  // 페이지 새로고침
  setTimeout(()=>rStudentDetail(),100);
}

let _ttW = parseInt(localStorage.getItem('bm_ttW')||'48');

function adjTT(type, delta){
  if(type==='w'){
    _ttW = Math.min(120, Math.max(28, _ttW + delta));
    localStorage.setItem('bm_ttW', _ttW);
  } else if(type==='f'){
    _ttF = Math.min(18, Math.max(7, _ttF + delta));
    localStorage.setItem('bm_ttF', _ttF);
  } else if(type==='r'){
    _ttW=48; _ttF=10;
    localStorage.removeItem('bm_ttW');
    localStorage.removeItem('bm_ttF');
  }
  applyTTDim();
}

let _fbInit = false;

function initFirebase(){
  if(_fbInit) return; // 중복 방지
  _fbInit = true;
  _unsub.forEach(u=>{try{u();}catch(e){}});
  _unsub = [];

  const db = window._db;
  let tLoaded=false, lLoaded=false;

  function tryShow(){
    if(!tLoaded||!lLoaded) return;
    buildLoginList();
    updCnt();
    // 앱이 이미 표시 중이면 페이지 이동 안 함
    const appEl = document.getElementById('app');
    if(appEl && appEl.style.display !== 'none') return;
    // 로그인 상태 복구: localStorage(유지) 우선, 없으면 sessionStorage(새로고침)
    const savedKey = localStorage.getItem('bm_persistKey') || sessionStorage.getItem('bm_loginKey');
    if(savedKey){
      _applyLogin(savedKey);
    }
    // 체크박스 상태 복구
    const keepChk = document.getElementById('keep-login');
    if(keepChk) keepChk.checked = !!localStorage.getItem('bm_persistKey');
  }

  // 현재 열린 뷰 새로고침 - onSnapshot이 자동으로 처리하므로 탭 클릭 불필요
  function refreshCurrentView(){
    const appEl = document.getElementById('app');
    if(!appEl || appEl.style.display==='none') return;
    updCnt();
    // 페이지 이동 없이 데이터만 업데이트
  }

  // teachers 실시간
  _unsub.push(db.collection('teachers').onSnapshot(snap=>{
    if(!snap.empty){
      T=snap.docs.map(d=>{const v=d.data();v._id=d.id;return v;});
      T.sort((a,b)=>parseInt(a._id||99)-parseInt(b._id||99));
    }
    tLoaded=true;
    if(document.getElementById('switcher-list')) buildSwitcherList();
    tryShow();
  }, e=>{console.warn('teachers:',e);tLoaded=true;tryShow();}));

  // lessons 실시간 - 데이터만 업데이트, 페이지 이동 없음
  _unsub.push(db.collection('lessons').onSnapshot(snap=>{
    lessons=snap.docs.map(d=>{const v=d.data();v._id=d.id;return v;});
    lLoaded=true;
    tryShow();
    updCnt();
  }, e=>{console.warn('lessons:',e);lLoaded=true;tryShow();}));

  // attendance 실시간 - 데이터만 업데이트
  _unsub.push(db.collection('attendance').onSnapshot(snap=>{
    att={};
    snap.docs.forEach(d=>{
      const v=d.data();
      if(v.ti!==undefined&&v.student&&v.date&&v.status){
        if(!att[v.ti])att[v.ti]={};
        if(!att[v.ti][v.student])att[v.ti][v.student]={};
        att[v.ti][v.student][v.date]=v.status;
      }
    });
    updCnt();
  }, e=>console.warn('att:',e)));

  // passwords 로드
  db.collection('meta').doc('passwords').get().then(snap=>{
    if(snap.exists){const data=snap.data();Object.assign(PASSWORDS, data);}
  }).catch(()=>{});

  // 초기화 체크 - Firebase에 데이터 있으면 절대 덮어쓰지 않음
  // uploadInitialData는 완전히 비활성화
}

// Firebase CRUD 함수 (compat SDK)
function fbSaveLesson(obj){
  const db=window._db;
  const id=obj._id||('L'+Date.now());
  obj._id=id;
  const {_id,...data}=obj;
  return db.collection('lessons').doc(id).set(data);
}
function fbDelLesson(id){
  return window._db.collection('lessons').doc(id).delete();
}
function fbSaveAtt(ti,student,date,status){
  const db=window._db;
  const id=(ti+'_'+student+'_'+date).replace(/[/\s]/g,'_');
  if(status) return db.collection('attendance').doc(id).set({ti,student,date,status});
  else return db.collection('attendance').doc(id).delete();
}

    type:'individual',ti,student:s,
    course,
    level:document.getElementById('mlevel')?.value.trim()||'',
    gender:document.getElementById('mgender')?.value||'',
    freq,
    maxWeek:parseInt(document.getElementById('mmaxw')?.value)||4,
    currSession:parseInt(document.getElementById('mcurrsession')?.value)||0,
    startDate:document.getElementById('mstart')?.value||'',
    memo:document.getElementById('mmemo')?.value.trim()||'',
    ...(ipsTeacher!==undefined?{ipsTeacher}:{})
  };

  // ⚠️ editIdx 사용 전에 ID를 먼저 확보
  const _editLesson = editIdx!==null ? lessons[editIdx] : null;
  const _isEdit = _editLesson != null;
  const _studentName = s;

  closeLsn(); // 팝업 닫기

  // 입시담당 선생님 - 같은 학생의 모든 레슨에 일괄 적용
  function applyIpsTeacher(studentName, ipsTeacherVal){
    if(ipsTeacherVal===undefined) return;
    const sameStudentLessons=lessons.filter(l=>l.student===studentName&&l.type==='individual'&&l.course==='입시');
    sameStudentLessons.forEach(l=>{
      if(l._id && l._id !== (_editLesson?._id)){
        const {_id,...data}={...l, ipsTeacher: ipsTeacherVal};
        window._db.collection('lessons').doc(l._id).set(data).catch(()=>{});
      }
    });
  }

  if(freq===2){
    const day1=parseInt(document.getElementById('mday2a')?.value)||0;
    const time1=document.getElementById('mtime2a')?.value||'15:00';
    const day2=parseInt(document.getElementById('mday2b')?.value)||0;
    const time2=document.getElementById('mtime2b')?.value||'15:00';

    const id1=_editLesson?._id||('L'+Date.now());
    const id2=_editLesson?.pairId||('L'+(Date.now()+1));

    const obj1={...common,day:day1,time:time1,pairId:id2};
    const obj2={...common,day:day2,time:time2,pairId:id1};

    window._db.collection('lessons').doc(id1).set(obj1).then(()=>{});
    window._db.collection('lessons').doc(id2).set(obj2)
      .then(()=>{
        showToast(_isEdit?'✅ 수정됐습니다':'✅ 등록됐습니다');
        updCnt();
        if(ipsTeacher!==undefined) applyIpsTeacher(_studentName, ipsTeacher);
      })
      .catch(e=>showToast('❌ 저장 실패: '+e.message));

  } else if(freq===0){
    const sd=document.getElementById('mshortdate')?.value;
    const lday=sd?new Date(sd).getDay():0;
    const ltime=document.getElementById('mtimeS')?.value||'15:00';
    const obj={...common,day:lday,time:ltime,shortDate:sd||''};
    const id=_editLesson?._id||('L'+Date.now());
    window._db.collection('lessons').doc(id).set(obj)
      .then(()=>{
        showToast(_isEdit?'✅ 수정됐습니다':'✅ 저장됐습니다');
        updCnt();
        if(ipsTeacher!==undefined) applyIpsTeacher(_studentName, ipsTeacher);
      })
      .catch(e=>showToast('❌ 저장 실패: '+e.message));

  } else {
    const lday=parseInt(document.getElementById('mday')?.value)||0;
    const ltime=document.getElementById('mtime')?.value||'15:00';
    const obj={...common,day:lday,time:ltime};
    const id=_editLesson?._id||('L'+Date.now());
    window._db.collection('lessons').doc(id).set(obj)
      .then(()=>{
        showToast(_isEdit?'✅ 수정됐습니다':'✅ 저장됐습니다');
        updCnt();
        if(ipsTeacher!==undefined) applyIpsTeacher(_studentName, ipsTeacher);
      })
      .catch(e=>showToast('❌ 저장 실패: '+e.message));
  }
};

window._delLsn = function(){
  if(!_checkDB()) return;
  if(editIdx===null){alert('삭제할 수업이 선택되지 않았습니다.');return;}
  if(!confirm('이 수업을 삭제할까요?'))return;
  const l=lessons[editIdx];
  if(!l){showToast('❌ 수업을 찾을 수 없습니다');return;}
  const db=window._db;

  // 즉시 팝업 닫기
  closeLsn();

  if(l._id){
    // 주2회 쌍 레슨도 함께 삭제
    const delIds=[l._id];
    if(l.pairId) delIds.push(l.pairId);
    Promise.all(delIds.map(id=>db.collection('lessons').doc(id).delete()))
      .then(()=>{showToast('🗑 삭제됐습니다');updCnt();})
      .catch(e=>showToast('❌ 삭제 실패: '+e.message));
  } else {
    let q=db.collection('lessons').where('ti','==',l.ti).where('day','==',l.day).where('time','==',l.time);
    if(l.type==='individual') q=q.where('student','==',l.student);
    q.get().then(snap=>{
      if(snap.empty){showToast('❌ 삭제할 항목 없음');return;}
      const batch=db.batch();
      snap.forEach(d=>batch.delete(d.ref));
      batch.commit()
        .then(()=>{showToast('🗑 삭제됐습니다');updCnt();})
        .catch(e=>showToast('❌ 삭제 실패: '+e.message));
    }).catch(e=>showToast('❌ 조회 실패: '+e.message));
  }
};

window._setAtt = function(ti,student,date,status){
  if(!att[ti])att[ti]={};
  if(!att[ti][student])att[ti][student]={};
  if(att[ti][student][date]===status){delete att[ti][student][date];fbSaveAtt(ti,student,date,null);}
  else{att[ti][student][date]=status;fbSaveAtt(ti,student,date,status);}
  rMyDay();
};

window._saveTch = function(){
  const name=document.getElementById('tname').value.trim();
  const s=document.getElementById('tshort').value.trim();
  const sub=document.getElementById('tsub').value.trim();
  const c=document.getElementById('tcolor').value;
  if(!name||!s){alert('이름과 약칭을 입력해 주세요');return;}
  const idx=tchIdx!==null?tchIdx:T.length;
  window._db.collection('teachers').doc(String(idx)).set({name,s,sub,c})
    .then(()=>{showToast('✅ 저장됐습니다');closeTch();buildRSel();rMgr();})
    .catch(e=>alert('저장 실패: '+e.message));
};

window._delTch = function(){
  if(tchIdx===null)return;
  if(!confirm(`${T[tchIdx].name} 선생님 삭제? (담당 수업도 삭제됩니다)`))return;
  const db=window._db;
  const batch=db.batch();
  batch.delete(db.collection('teachers').doc(String(tchIdx)));
  lessons.filter(l=>l.ti===tchIdx&&l._id).forEach(l=>batch.delete(db.collection('lessons').doc(l._id)));
  batch.commit()
    .then(()=>{showToast('🗑 삭제됐습니다');closeTch();buildRSel();updCnt();rMgr();})
    .catch(e=>alert('삭제 실패: '+e.message));
};

document.addEventListener('DOMContentLoaded', function(){
  // 즉시 fallback 목록 표시 (JS 오류 방지)
  const fallback = document.getElementById('login-fallback');
  if(fallback) fallback.style.display = 'block';

  // JS로 목록 빌드 시도
  try { buildLoginList(); } catch(e){
    console.error('buildLoginList 오류:', e);
    // 오류시 fallback 유지
    if(fallback) fallback.style.display = 'block';
  }

  if(window._fbReady){
    initFirebase();
  } else {
    window.addEventListener('fb-ready', initFirebase);
    setTimeout(()=>{
      if(!window._fbReady){
        console.warn('Firebase 연결 실패 - 오프라인 모드');
        try { buildLoginList(); } catch(e){}
      }
    }, 3000);
  }
});
