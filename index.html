function calcW(l){if(!l.startDate)return 0;const d=Math.floor((new Date('2026-04-24')-new Date(l.startDate))/864e5);return d<0?0:Math.floor(d/7)+1;}
function needsN(l){const w=calcW(l),mw=l.maxWeek||4;return w>0&&w%mw===0;}
function getNtc(){return lessons.filter(l=>l.type==='individual'&&needsN(l));}
function hasMk(ti,s){return mks.some(m=>m.ti===ti&&m.student===s);}
function totSt(){return new Set(lessons.filter(l=>l.type==='individual').map(l=>l.student+'_'+l.ti)).size;}
function myStCnt(ti){return new Set(lessons.filter(l=>l.type==='individual'&&l.ti===ti).map(l=>l.student)).size;}
function updCnt(){
  const el=document.getElementById('cnt');
  if(!el) return;
  if(isAdm()){
    const indiv=lessons.filter(l=>l.type==='individual'&&l.ti!==DTI&&l.day!==41);
    const total=new Set(indiv.map(l=>l.student+'_'+l.ti)).size;
    const w1=new Set(indiv.filter(l=>(l.freq||1)===1).map(l=>l.student+'_'+l.ti)).size;
    const w2=new Set(indiv.filter(l=>(l.freq||1)>=2).map(l=>l.student+'_'+l.ti)).size;
    const ips=new Set(indiv.filter(l=>l.course==='입시').map(l=>l.student+'_'+l.ti)).size;
    const hby=new Set(indiv.filter(l=>l.course==='취미').map(l=>l.student+'_'+l.ti)).size;
    el.style.display='';
    el.style.cssText='display:block;background:rgba(0,0,0,.75);color:#fff;font-size:10px;padding:3px 12px;text-align:center;flex-shrink:0;cursor:pointer;white-space:nowrap;overflow-x:auto;';
    el.onclick=()=>showView('stat');
    el.textContent=`👥 총 ${total}명  ·  주1회 ${w1}명  ·  주2회 ${w2}명  ·  입시 ${ips}명  ·  취미 ${hby}명`;
  } else {
    const ti=gTi();
    if(ti!==null){
      el.style.display='block';
      el.style.cssText='display:block;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:3px 12px;text-align:center;flex-shrink:0;';
      el.textContent=`담당 ${myStCnt(ti)}명`;
    } else {
      el.style.display='none';
    }
  }
}

  const reg=uniq.filter(l=>l.ti!==DTI),dance=uniq.filter(l=>l.ti===DTI);

function liH(l,ntc){
  const t=T[l.ti]||{},w=calcW(l),mw=l.maxWeek||4,mk=mks.filter(m=>m.ti===l.ti&&m.student===l.student),isN=ntc.some(n=>n.student===l.student&&n.ti===l.ti);
  const pct=Math.min(100,Math.round(w/mw*100));
  const wc=w>=mw?'#C00000':w>=(mw*.7)?'#854F0B':'#3B6D11';
  const wbg=w>=mw?'#FFEBEE':w>=(mw*.7)?'#FAEEDA':'#EAF3DE';
  return `<div class="li" style="border-left-color:${t.c||'#ccc'}">
    <div style="font-size:13px;font-weight:600;color:#1c1c1e;display:flex;align-items:center;gap:4px">
      ${l.student}${mk.length?`<span class="upd">보강</span>`:''}
      ${l.course==='입시'?`<span class="course-i">입시</span>`:''}${isN?'<span class="ntc">안내필요</span>':''}
    </div>
    <div style="font-size:10px;color:${t.c||'#888'};margin-top:2px">${t.name||''} · ${DL[l.day]||''} ${l.time} · ${l.level||''}</div>
    <div style="margin-top:4px;display:flex;align-items:center;gap:6px">
      <div class="progress-wrap"><div class="progress-bar" style="background:${t.c||'#888'};width:${pct}%"></div></div>
      <span class="wb" style="background:${wbg};color:${wc}">${w}/${mw}주차</span>
      <span style="font-size:9px;color:#8e8e93">주${l.freq}회</span>
    </div>
  </div>`;
}

function rAtt(){
  const isDanceT2=(gTi()===DTI),isAdV2=isAdm();

    ...(isAdV2||!isDanceT2?[{id:4,l:'금'}]:[]),

    {id:5,l:'토'}];
  let h=`<div class="chip-bar">`;TABS.forEach(tab=>{h+=`<button class="chip${selDay===tab.id?' on':''}" onclick="selDay=${tab.id};rAtt()">${tab.l}</button>`;});h+=`</div>`;
  const dates=DD[selDay]||[];const tio=T.map((_,i)=>i);

  <div class="att-wrap"><table class="at"><thead><tr><th style="text-align:left">학생</th><th>선생</th>`;
  dates.forEach(d=>h+=`<th>${d}</th>`);h+=`<th>출</th><th>결</th></tr></thead><tbody>`;
  dayL.forEach(l=>{const t=T[l.ti]||{};let pc=0,ac=0;h+=`<tr><td style="text-align:left;font-weight:600;white-space:nowrap">${l.student}</td><td style="color:${t.c||'#888'};font-weight:600;white-space:nowrap">${t.s||''}</td>`;
    dates.forEach(date=>{const v=((att[l.ti]||{})[l.student]||{})[date]||'';const dc=v==='present'?'#E8F5E9':v==='absent'?'#FFEBEE':v==='makeup'?'#E3F2FD':'';const tc=v==='present'?'#2E7D32':v==='absent'?'#C00000':v==='makeup'?'#1565C0':'';const lb=v==='present'?'출':v==='absent'?'결':v==='makeup'?'보':'';if(v==='present')pc++;if(v==='absent')ac++;h+=`<td><div class="mdot" style="background:${dc};color:${tc}">${lb}</div></td>`;});
    h+=`<td style="color:#2E7D32;font-weight:700">${pc}</td><td style="color:#C00000;font-weight:700">${ac}</td></tr>`;});

// ── 레이아웃 설정 적용 ──────────────────────────────────
function applyLayout(mode){
  document.body.classList.remove('force-landscape','force-portrait');
  if(mode==='landscape') document.body.classList.add('force-landscape');
  else if(mode==='portrait') document.body.classList.add('force-portrait');
  localStorage.setItem('bm_layout', mode||'auto');
}
// 앱 시작 시 저장된 레이아웃 적용
(function(){
  const m=localStorage.getItem('bm_layout');
  if(m&&m!=='auto')applyLayout(m);
  // 시간표 크기 적용
  const sz=localStorage.getItem('bm_tt_size');
  if(sz) applyTTSize(parseInt(sz));
})();

function applyTTSize(size){
  size = Math.min(20, Math.max(8, size));
  // 시간표 CSS 동적 적용
  let style = document.getElementById('_tt_size_style');
  if(!style){
    style = document.createElement('style');
    style.id = '_tt_size_style';
    document.head.appendChild(style);
  }
  style.textContent = `
    .tt{font-size:${size}px !important;}
    .lb,.lb-t{font-size:${size}px !important;}
    .gb{font-size:${Math.max(7,size-1)}px !important;}
    .tc{font-size:${Math.max(7,size-1)}px !important;}

  `;
}

function setTTSize(size){
  size = Math.min(20, Math.max(8, size));
  localStorage.setItem('bm_tt_size', size);
  applyTTSize(size);
  rSet(); // 설정 화면 새로고침
}

    </div>`;
  }

}

function changePw(key){
  const old=document.getElementById('pw-old').value;
  const nw=document.getElementById('pw-new').value;
  const nw2=document.getElementById('pw-new2').value;
  const msg=document.getElementById('pw-msg');
  if(old !== (PASSWORDS[key]||'1234')){msg.textContent='현재 비밀번호가 틀렸습니다';return;}
  if(!nw||nw.length<4){msg.textContent='4자리 이상 입력해 주세요';return;}
  if(nw!==nw2){msg.textContent='새 비밀번호가 일치하지 않습니다';return;}
  PASSWORDS[key]=nw;
  if(window._db) window._db.collection('meta').doc('passwords').set(PASSWORDS).catch(()=>{});
  msg.style.color='#2E7D32';msg.textContent='✅ 비밀번호가 변경됐습니다!';
  setTimeout(()=>{document.getElementById('pw-old').value='';document.getElementById('pw-new').value='';document.getElementById('pw-new2').value='';},500);
}

function resetAllPw(){
  if(!confirm('모든 비밀번호를 0000으로 초기화할까요?'))return;
  Object.keys(PASSWORDS).forEach(k=>PASSWORDS[k]='0000');
  if(window._db) window._db.collection('meta').doc('passwords').set(PASSWORDS).catch(()=>{});
  showToast('✅ 모든 비밀번호가 0000으로 초기화됐습니다');
}

// ── 통계 페이지 ──────────────────────────────────────────
function rStat(){
  const indiv=lessons.filter(l=>l.type==='individual'&&l.ti!==DTI&&l.day!==41);
  const uniq=arr=>new Set(arr.map(l=>l.student+'_'+l.ti)).size;
  const total=uniq(indiv);
  const w1=uniq(indiv.filter(l=>(l.freq||1)===1));
  const w2=uniq(indiv.filter(l=>(l.freq||1)>=2));
  const ips=uniq(indiv.filter(l=>l.course==='입시'));
  const hby=uniq(indiv.filter(l=>l.course==='취미'));
  const totalHrs=indiv.reduce((a,l)=>a+(l.freq||1),0);
  const card=(icon,label,val,color)=>`<div style="background:#fff;border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)">
    <div style="font-size:26px">${icon}</div>
    <div><div style="font-size:11px;color:#8e8e93">${label}</div>
    <div style="font-size:22px;font-weight:800;color:${color}">${val}</div></div>
  </div>`;
  let h=`<div class="sec-lbl" style="padding:16px 16px 8px;font-size:13px;font-weight:700">📊 수강 현황</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px">
    ${card('👥','총 수강생',total+'명','#C00000')}
    ${card('⏰','주간 총 수업',totalHrs+'시간','#1565C0')}
    ${card('1️⃣','주 1회',w1+'명','#2E7D32')}
    ${card('2️⃣','주 2회',w2+'명','#6A1B9A')}
    ${card('🎓','입시',ips+'명','#E53935')}
    ${card('🎵','취미',hby+'명','#F57C00')}
  </div>
  <div style="padding:0 12px 6px;font-size:11px;font-weight:700;color:#8e8e93">선생님별 담당</div>`;
  T.forEach((t,i)=>{
    if(i===DTI)return;
    const cnt=new Set(lessons.filter(l=>l.ti===i&&l.type==='individual').map(l=>l.student)).size;
    if(!cnt)return;
    const w1c=new Set(lessons.filter(l=>l.ti===i&&l.type==='individual'&&(l.freq||1)===1).map(l=>l.student)).size;
    const w2c=new Set(lessons.filter(l=>l.ti===i&&l.type==='individual'&&(l.freq||1)>=2).map(l=>l.student)).size;
    h+=`<div style="margin:0 12px 6px;background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)">
      <div style="width:32px;height:32px;border-radius:50%;background:${bg(t.c)};color:${t.c};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">${t.s}</div>
      <div style="flex:1"><div style="font-size:12px;font-weight:700">${t.name}</div>
      <div style="font-size:10px;color:#8e8e93">주1회 ${w1c}명 · 주2회 ${w2c}명</div></div>
      <div style="font-size:20px;font-weight:800;color:${t.c}">${cnt}명</div>

  });

}

function openAddTch(){tchIdx=null;document.getElementById('ttitle').textContent='선생님 추가';document.getElementById('tdelbtn').style.display='none';['tname','tshort','tsub'].forEach(id=>document.getElementById(id).value='');document.getElementById('tcolor').value='#E53935';document.getElementById('mtch').classList.add('on');}

function rAlert(){
  const today = new Date();
  const dayIdx = today.getDay(); // 0=일,1=월...6=토
  const dayMap = {1:0,2:1,3:2,4:3,5:4,6:5};
  const todayDayKey = dayMap[dayIdx];
  const isDanceT2=(gTi()===DTI),isAdV2=isAdm();
  const TABS=[{id:0,l:'월'},{id:1,l:'화'},{id:2,l:'수'},{id:3,l:'목'},
    ...(isAdV2||!isDanceT2?[{id:4,l:'금'}]:[]),
    ...(isAdV2||isDanceT2?[{id:41,l:'금(댄)'}]:[]),
    {id:5,l:'토'}];
  let h=`<div class="sec-lbl">📣 출석 미등록 알림</div>
  <div class="chip-bar">`;
  TABS.forEach(tab=>{h+=`<button class="chip${selDay===tab.id?' on':''}" onclick="selDay=${tab.id};rAlert()">${tab.l}</button>`;});

  const dates=DD[selDay]||[];
  const tiOrder=T.map((_,i)=>i);
  const dayL=lessons.filter(l=>l.day===selDay&&l.type==='individual').sort((a,b)=>tiOrder.indexOf(a.ti)-tiOrder.indexOf(b.ti));

  if(!dayL.length){h+=`<div class="empty">이 요일 수업이 없습니다</div>`;document.getElementById('page').innerHTML=h;return;}

  // 미등록자 찾기
  const unregistered={};
  dayL.forEach(l=>{
    dates.forEach(date=>{
      const v=((att[l.ti]||{})[l.student]||{})[date]||'';
      if(!v){ // 출석 미등록
        const tName=T[l.ti]?.name||'';
        if(!unregistered[tName])unregistered[tName]={ti:l.ti,dates:{}};
        if(!unregistered[tName].dates[date])unregistered[tName].dates[date]=[];
        unregistered[tName].dates[date].push(l.student);
      }
    });
  });

  const teachers=Object.keys(unregistered);
  if(!teachers.length){
    h+=`<div class="empty">✅ 모든 출석이 등록되어 있습니다</div>`;
    document.getElementById('page').innerHTML=h;return;
  }

  h+=`<div class="nbar" style="margin-bottom:8px">
    <div class="nt">⚠️ 출석 미등록 선생님 (${teachers.length}명)</div>`;
  teachers.forEach(tName=>{
    const info=unregistered[tName];
    h+=`<div class="nr">• ${tName} — ${Object.keys(info.dates).map(d=>`${d}(${info.dates[d].length}명)`).join(', ')}</div>`;
  });
  h+=`</div>`;

  // 알림 메시지 미리보기
  h+=`<div class="li" style="margin-bottom:8px">
    <div style="font-size:12px;font-weight:700;margin-bottom:8px">📱 알림 메시지</div>`;
  teachers.forEach(tName=>{
    const info=unregistered[tName];
    const t=T[info.ti]||{};
    const msg=Object.keys(info.dates).map(d=>`${d}: ${info.dates[d].join(', ')}`).join('\n');
    h+=`<div style="background:${bg(t.c||'#888')};border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid ${t.c||'#888'}">
      <div style="font-size:11px;font-weight:700;color:${t.c||'#888'};margin-bottom:4px">${tName}</div>
      <div style="font-size:10px;color:#555;white-space:pre-line">출석 미등록 학생:\n${msg}</div>
      <button onclick="sendAlert('${tName}',\`${msg}\`)" style="margin-top:8px;background:${t.c||'#888'};color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;width:100%">
        📤 ${tName}에게 알림 보내기
      </button>

  });
  h+=`</div>`;

  // 전체 알림 보내기 버튼
  h+=`<button class="add-btn" onclick="sendAllAlerts(${JSON.stringify(unregistered).replace(/"/g,'&quot;')})">

  </button>`;

  document.getElementById('page').innerHTML=h;
}

// 알림 기록 저장
let alertHistory=[];

function sendAlert(teacherName, msg){
  const time=new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  alertHistory.unshift({to:teacherName,msg,time,sent:true});
  // 실제 알림은 카카오/문자 연동 필요 - 현재는 클립보드 복사
  const fullMsg=`[부산뮤직 일광점] ${teacherName} 선생님\n출석 미등록 학생이 있습니다:\n${msg}\n\n출석체크 앱에서 확인해 주세요.`;
  if(navigator.clipboard){
    navigator.clipboard.writeText(fullMsg).then(()=>{
      showToast(`✅ ${teacherName}에게 보낼 메시지가 클립보드에 복사됐습니다`);
    }).catch(()=>showToast(`📋 메시지: ${fullMsg}`));
  } else {
    alert(`📋 복사해서 보내세요:\n\n${fullMsg}`);
  }
}

function sendAllAlerts(unregistered){
  if(!confirm(`${Object.keys(unregistered).length}명의 선생님에게 알림을 보낼까요?`))return;
  Object.keys(unregistered).forEach(tName=>{
    const info=unregistered[tName];
    const msg=Object.keys(info.dates).map(d=>`${d}: ${info.dates[d].join(', ')}`).join('\n');
    sendAlert(tName,msg);
  });
}

function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;z-index:999;white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._to);t._to=setTimeout(()=>t.style.display='none',3000);
}

function setAtt(ti,s,date,st){
  if(!att[ti])att[ti]={};
  if(!att[ti][s])att[ti][s]={};
  if(att[ti][s][date]===st){
    delete att[ti][s][date];
    if(window._db) fbSaveAtt(ti,s,date,null);
  } else {
    att[ti][s][date]=st;
    if(window._db) fbSaveAtt(ti,s,date,st);
  }
  rMyDay();
}

function saveLsn(){
  // _saveLsn이 있으면 그걸 사용 (Firebase 저장), 없으면 직접 저장
  if(window._saveLsn){ window._saveLsn(); return; }
  const type=document.getElementById('mtype').value,ti=parseInt(document.getElementById('mteach').value),day=parseInt(document.getElementById('mday').value),time=document.getElementById('mtime').value;
  let obj;
  if(type==='group'){const gn=document.getElementById('mgrp').value.trim();if(!gn){alert('수업명을 입력해 주세요');return;}obj={type:'group',day,time,ti,groupname:gn};}
  else{
    const s=document.getElementById('mstud').value.trim();if(!s){alert('학생 이름을 입력해 주세요');return;}
    obj={type:'individual',day,time,ti,student:s,
      course:document.getElementById('mcourse').value,
      level:document.getElementById('mlevel').value.trim(),
      freq:parseInt(document.getElementById('mfreq').value),
      maxWeek:parseInt(document.getElementById('mmaxw').value),
      totalSession:parseInt(document.getElementById('msession').value)||0,
      currSession:parseInt(document.getElementById('mcurrsession').value)||0,
      startDate:document.getElementById('mstart').value,
      memo:document.getElementById('mmemo').value.trim()};
  }
  const id = (editIdx!==null&&lessons[editIdx]?._id) ? lessons[editIdx]._id : ('L'+Date.now());
  closeLsn();
  if(window._db){
    const {_id,...data}={...obj,_id:id};
    window._db.collection('lessons').doc(id).set(data)
      .then(()=>{showToast('✅ 저장됐습니다');updCnt();})
      .catch(e=>showToast('❌ 저장 실패: '+e.message));
  } else {
    if(editIdx!==null)lessons[editIdx]=obj;else lessons.push(obj);
    updCnt();document.querySelector('.tb.on')?.click();
  }
}
function delLsn(){
  if(window._delLsn){ window._delLsn(); return; }
  if(editIdx===null)return;
  if(!confirm('이 수업을 삭제할까요?'))return;
  const l=lessons[editIdx];
  closeLsn();
  if(window._db && l?._id){
    window._db.collection('lessons').doc(l._id).delete()
      .then(()=>{showToast('🗑 삭제됐습니다');updCnt();})
      .catch(e=>showToast('❌ 삭제 실패: '+e.message));
  } else {
    lessons.splice(editIdx,1);updCnt();document.querySelector('.tb.on')?.click();
  }
}
function closeLsn(){document.getElementById('mlsn').classList.remove('on');editIdx=null;}
function toggleType(v){document.getElementById('indf').style.display=v==='individual'?'block':'none';document.getElementById('grpf').style.display=v==='group'?'block':'none';}
function fillT(sel){
  const s=document.getElementById('mteach');s.innerHTML='';

document.addEventListener('touchstart', e=>{_tsX=e.touches[0].clientX;}, {passive:true});

// 관리자: 0000 / 각 선생님: 초기값 1234 (선생님관리에서 변경가능)
let PASSWORDS = {
  admin: '0000',
  0:'1234', 1:'1234', 2:'1234', 3:'1234', 4:'1234',
  5:'1234', 6:'1234', 7:'1234', 8:'1234', 9:'1234', 10:'1234'
};

let selLoginKey = null;

function buildLoginList(){
  const list = document.getElementById('login-list');
  const fallback = document.getElementById('login-fallback');
  if(!list) return;

  list.innerHTML = '';

  // 관리자 버튼
  const adminBtn = document.createElement('button');
  adminBtn.className = 'login-btn';
  adminBtn.id = 'login-btn-admin';
  adminBtn.innerHTML = `<div class="login-av" style="background:rgba(192,0,0,0.09);color:#C00000">관</div>
    <div class="login-info"><div class="login-name">관리자</div><div class="login-sub">원장 / 부원장</div></div>
    <span style="font-size:16px;color:#ccc">›</span>`;
  adminBtn.onclick = () => selectLogin('admin');
  list.appendChild(adminBtn);

  // 구분선
  const div = document.createElement('div');
  div.style.cssText = 'border-top:.5px solid #e5e5e5;margin:4px 0';
  list.appendChild(div);

  // 선생님 목록
  T.forEach((t,i)=>{
    const btn = document.createElement('button');
    btn.className = 'login-btn';
    btn.id = `login-btn-${i}`;
    const bgColor = bg(t.c);
    btn.innerHTML = `<div class="login-av" style="background:${bgColor};color:${t.c}">${t.s}</div>
      <div class="login-info"><div class="login-name">${t.name}</div><div class="login-sub">${t.sub}</div></div>
      <span style="font-size:16px;color:#ccc">›</span>`;
    btn.onclick = () => selectLogin(String(i));
    list.appendChild(btn);
  });

  // list가 채워지면 fallback 숨기기, 안 채워지면 fallback 표시
  if(list.children.length > 0){
    if(fallback) fallback.style.display = 'none';
  } else {
    if(fallback) fallback.style.display = 'block';
  }
}

function selectLogin(key){
  selLoginKey = key;
  document.querySelectorAll('.login-btn').forEach(b=>b.classList.remove('selected'));
  const btnEl = document.getElementById(key==='admin'?'login-btn-admin':`login-btn-${key}`);
  if(btnEl) btnEl.classList.add('selected');
  const pw = document.getElementById('pw-wrap');
  if(pw) pw.style.display = 'block';
  const sub = document.getElementById('login-submit');
  if(sub) sub.style.display = '';
  const inp = document.getElementById('pw-input');
  if(inp){ inp.value=''; inp.focus(); }
  const err = document.getElementById('login-err');
  if(err) err.textContent='';
}

function doLogin(){
  const pw = document.getElementById('pw-input').value;
  const correct = PASSWORDS[selLoginKey] || '1234';
  if(pw !== correct){
    document.getElementById('login-err').textContent = '비밀번호가 틀렸습니다';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
    return;
  }
  // 로그인 상태 저장 (새로고침 후 복구용)
  sessionStorage.setItem('bm_loginKey', selLoginKey);
  _applyLogin(selLoginKey);
}

function _applyLogin(key){
  selLoginKey = key;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  loginRole = key === 'admin' ? 'admin' : key;
  role = loginRole;
  const name = key === 'admin' ? '관리자' : T[parseInt(key)]?.name || '';
  document.getElementById('logout-btn').textContent = name + ' · 로그아웃';
  if(isAdm()){
    document.getElementById('teacher-switcher').style.display = '';
    buildSwitcherList();
    document.getElementById('switcher-label').textContent = '선생님 선택';
  } else {
    document.getElementById('teacher-switcher').style.display = 'none';
  }
  buildTabs();
  showView(isAdm() ? 'tt' : 'my-day');
}

// ── 선생님 전환 (관리자 전용) ────────────────────────────
function buildSwitcherList(){
  const list = document.getElementById('switcher-list');
  if(!list) return;
  list.innerHTML = '';
  T.forEach((t,i)=>{
    const item = document.createElement('div');
    item.style.cssText = 'padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:.5px solid #f5f5f5;active:background:#f0f0f0;';
    item.innerHTML = `
      <span style="width:30px;height:30px;border-radius:50%;background:${bg(t.c)};color:${t.c};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${t.s}</span>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:700;color:#1c1c1e">${t.name}</div>
        <div style="font-size:10px;color:#8e8e93;margin-top:1px">${t.sub}</div>
      </div>
      <span style="font-size:11px;color:#ccc">›</span>`;
    item.onclick = () => switchToTeacher(i);
    // 터치 피드백
    item.addEventListener('touchstart', ()=>item.style.background='#f5f5f5');
    item.addEventListener('touchend', ()=>item.style.background='');
    list.appendChild(item);
  });
}

function toggleSwitcher(){
  const menu = document.getElementById('switcher-menu');
  menu.style.display = menu.style.display === 'none' ? '' : 'none';
}

function switchToTeacher(ti){
  if(!isLoginAdm()) return; // 실제 관리자 로그인만 전환 가능
  role = String(ti);
  const menu = document.getElementById('switcher-menu');
  if(menu) menu.style.display = 'none';
  const label = document.getElementById('switcher-label');
  if(label) label.textContent = T[ti]?.name || '';
  const sub = document.getElementById('hdr-sub');
  if(sub) sub.textContent = T[ti]?.name + ' 선생님';
  selDay = 1; selDate = null;
  buildTabs();
  showView('my-tt');
}

function switchToAdmin(){
  if(!isLoginAdm()) return;
  role = 'admin';
  const menu = document.getElementById('switcher-menu');
  if(menu) menu.style.display = 'none';
  const label = document.getElementById('switcher-label');
  if(label) label.textContent = '선생님 선택';
  const sub = document.getElementById('hdr-sub');
  if(sub) sub.textContent = '실용음악학원';
  selDay = 1; selDate = null;
  buildTabs();
  showView('tt');
}

// 외부 클릭시 메뉴 닫기
document.addEventListener('click', e => {

function doLogout(){
  if(!confirm('로그아웃 하시겠습니까?')) return;
  sessionStorage.removeItem('bm_loginKey');
  role = 'admin';
  loginRole = 'admin';
  selLoginKey = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('pw-wrap').style.display = 'none';
  document.getElementById('login-submit').style.display = 'none';
  document.getElementById('pw-input').value = '';
  document.getElementById('login-err').textContent = '';

// 전체 시간표 셀 크기 조절
let _ttW = parseInt(localStorage.getItem('bm_ttW')||'48');
let _ttF = parseInt(localStorage.getItem('bm_ttF')||'10');

function adjTT(type, delta){
  if(type==='w'){
    _ttW = Math.min(120, Math.max(28, _ttW + delta));
    localStorage.setItem('bm_ttW', _ttW);
  } else if(type==='f'){
    _ttF = Math.min(18, Math.max(7, _ttF + delta));
    localStorage.setItem('bm_ttF', _ttF);
  } else if(type==='r'){
    _ttW=48; _ttF=10;
    localStorage.removeItem('bm_ttW');
    localStorage.removeItem('bm_ttF');
  }
  applyTTDim();
}

function applyTTDim(){
  let st = document.getElementById('_tt_dim_style');
  if(!st){ st=document.createElement('style'); st.id='_tt_dim_style'; document.head.appendChild(st); }
  st.textContent = `
    .tt{font-size:${_ttF}px !important;}
    .tt th{font-size:${Math.max(7,_ttF-1)}px !important;min-width:${_ttW}px !important;}
    .tt td{min-width:${_ttW}px !important;}
    .lb,.lb-t{font-size:${_ttF}px !important;padding:2px 3px !important;}
    .gb{font-size:${Math.max(7,_ttF-1)}px !important;}
    .tc{font-size:${_ttF}px !important;width:${Math.max(32,_ttW-8)}px !important;}
  `;
}

function initFirebase(){
  const db = window._db;
  let tLoaded=false, lLoaded=false;

  function tryShow(){
    if(!tLoaded||!lLoaded) return;
    buildLoginList();
    updCnt();
    // 새로고침 후 로그인 세션 복구
    const savedKey = sessionStorage.getItem('bm_loginKey');
    if(savedKey){
      _applyLogin(savedKey);
    }
  }

  // 현재 열린 뷰 새로고침
  function refreshCurrentView(){
    const appEl = document.getElementById('app');
    if(!appEl || appEl.style.display==='none') return;
    updCnt();
    const at = document.querySelector('.tb.on');
    if(at) setTimeout(()=>at.click(), 100);
  }

  // teachers 실시간
  _unsub.push(db.collection('teachers').onSnapshot(snap=>{
    if(!snap.empty){
      T=snap.docs.map(d=>{const v=d.data();v._id=d.id;return v;});
      T.sort((a,b)=>parseInt(a._id||99)-parseInt(b._id||99));
    }
    tLoaded=true;
    if(document.getElementById('switcher-list')) buildSwitcherList();
    tryShow();
  }, e=>{console.warn('teachers:',e);tLoaded=true;tryShow();}));

  // lessons 실시간 - 다른 기기에서 변경 시 즉시 반영
  _unsub.push(db.collection('lessons').onSnapshot(snap=>{
    lessons=snap.docs.map(d=>{const v=d.data();v._id=d.id;return v;});
    lLoaded=true;
    tryShow();
    refreshCurrentView();
  }, e=>{console.warn('lessons:',e);lLoaded=true;tryShow();}));

  // attendance 실시간 - 출석 변경 즉시 반영
  _unsub.push(db.collection('attendance').onSnapshot(snap=>{
    att={};
    snap.docs.forEach(d=>{
      const v=d.data();
      if(v.ti!==undefined&&v.student&&v.date&&v.status){
        if(!att[v.ti])att[v.ti]={};
        if(!att[v.ti][v.student])att[v.ti][v.student]={};
        att[v.ti][v.student][v.date]=v.status;
      }
    });
    // 출석 탭 열려있으면 새로고침
    const appEl = document.getElementById('app');
    if(appEl && appEl.style.display!=='none'){
      const at = document.querySelector('.tb.on');
      if(at && (at.textContent.includes('출석')||at.textContent.includes('체크'))) at.click();
    }
  }, e=>console.warn('att:',e)));

  // passwords 로드
  db.collection('meta').doc('passwords').get().then(snap=>{
    if(snap.exists){const data=snap.data();Object.assign(PASSWORDS, data);}
  }).catch(()=>{});

  // 초기화 체크 - Firebase에 데이터 있으면 절대 덮어쓰지 않음
  // uploadInitialData는 완전히 비활성화
}

// Firebase CRUD 함수 (compat SDK)
function fbSaveLesson(obj){
  const db=window._db;
  const id=obj._id||('L'+Date.now());
  obj._id=id;
  const {_id,...data}=obj;
  return db.collection('lessons').doc(id).set(data);
}
function fbDelLesson(id){
  return window._db.collection('lessons').doc(id).delete();
}
function fbSaveAtt(ti,student,date,status){
  const db=window._db;
  const id=(ti+'_'+student+'_'+date).replace(/[/\s]/g,'_');
  if(status) return db.collection('attendance').doc(id).set({ti,student,date,status});
  else return db.collection('attendance').doc(id).delete();
}

// ── Firebase CRUD 오버라이드 (compat SDK) ────────────────
function _checkDB(){
  if(!window._db){
    alert('Firebase 연결 중입니다. 잠시 후 다시 시도해 주세요.');
    return false;
  }
  return true;
}

window._saveLsn = function(){
  if(!_checkDB()) return;
  const type=document.getElementById('mtype').value;
  const ti=parseInt(document.getElementById('mteach').value);
  const day=parseInt(document.getElementById('mday').value);
  const time=document.getElementById('mtime').value;
  let obj;
  if(type==='group'){
    const gn=document.getElementById('mgrp').value.trim();
    if(!gn){alert('수업명을 입력해 주세요');return;}
    obj={type:'group',day,time,ti,groupname:gn};
  } else {
    const s=document.getElementById('mstud').value.trim();
    if(!s){alert('학생 이름을 입력해 주세요');return;}
    obj={type:'individual',day,time,ti,student:s,
      course:document.getElementById('mcourse').value,
      level:document.getElementById('mlevel').value.trim(),
      freq:parseInt(document.getElementById('mfreq').value)||1,
      maxWeek:parseInt(document.getElementById('mmaxw').value)||4,
      totalSession:parseInt(document.getElementById('msession').value)||0,
      currSession:parseInt(document.getElementById('mcurrsession').value)||0,
      startDate:document.getElementById('mstart').value||'',
      memo:document.getElementById('mmemo').value.trim()||''};
  }
  // editIdx로 기존 수업 수정인지 확인
  let id;
  if(editIdx!==null && lessons[editIdx]){
    id = lessons[editIdx]._id || ('L'+Date.now());
  } else {
    id = 'L'+Date.now();
  }
  const {_id,...data}=({...obj,_id:id});

  // 즉시 팝업 닫기 (Firebase 응답 전에)
  closeLsn();

  window._db.collection('lessons').doc(id).set(data)
    .then(()=>{
      showToast('✅ 저장됐습니다');
      updCnt();
      const at=document.querySelector('.tb.on');if(at)at.click();
    })
    .catch(e=>{
      console.error('저장 실패:', e);
      showToast('❌ 저장 실패: '+e.message);
    });
};

window._delLsn = function(){
  if(!_checkDB()) return;
  if(editIdx===null){alert('삭제할 수업이 선택되지 않았습니다.');return;}
  if(!confirm('이 수업을 삭제할까요?'))return;
  const l=lessons[editIdx];
  if(!l){showToast('❌ 수업을 찾을 수 없습니다');return;}
  const db=window._db;

  // 즉시 팝업 닫기
  closeLsn();

  if(l._id){
    db.collection('lessons').doc(l._id).delete()
      .then(()=>{showToast('🗑 삭제됐습니다');updCnt();const at=document.querySelector('.tb.on');if(at)at.click();})
      .catch(e=>showToast('❌ 삭제 실패: '+e.message));
  } else {
    let q=db.collection('lessons').where('ti','==',l.ti).where('day','==',l.day).where('time','==',l.time);
    if(l.type==='individual') q=q.where('student','==',l.student);
    q.get().then(snap=>{
      if(snap.empty){showToast('❌ 삭제할 항목 없음');return;}
      const batch=db.batch();
      snap.forEach(d=>batch.delete(d.ref));
      batch.commit()
        .then(()=>{showToast('🗑 삭제됐습니다');updCnt();const at=document.querySelector('.tb.on');if(at)at.click();})
        .catch(e=>showToast('❌ 삭제 실패: '+e.message));
    }).catch(e=>showToast('❌ 조회 실패: '+e.message));
  }
};

window._setAtt = function(ti,student,date,status){
  if(!att[ti])att[ti]={};
  if(!att[ti][student])att[ti][student]={};
  if(att[ti][student][date]===status){delete att[ti][student][date];fbSaveAtt(ti,student,date,null);}
  else{att[ti][student][date]=status;fbSaveAtt(ti,student,date,status);}
  rMyDay();
};

window._saveTch = function(){
  const name=document.getElementById('tname').value.trim();
  const s=document.getElementById('tshort').value.trim();
  const sub=document.getElementById('tsub').value.trim();
  const c=document.getElementById('tcolor').value;
  if(!name||!s){alert('이름과 약칭을 입력해 주세요');return;}
  const idx=tchIdx!==null?tchIdx:T.length;
  window._db.collection('teachers').doc(String(idx)).set({name,s,sub,c})
    .then(()=>{showToast('✅ 저장됐습니다');closeTch();buildRSel();rMgr();})
    .catch(e=>alert('저장 실패: '+e.message));
};

window._delTch = function(){
  if(tchIdx===null)return;
  if(!confirm(`${T[tchIdx].name} 선생님 삭제? (담당 수업도 삭제됩니다)`))return;
  const db=window._db;
  const batch=db.batch();
  batch.delete(db.collection('teachers').doc(String(tchIdx)));
  lessons.filter(l=>l.ti===tchIdx&&l._id).forEach(l=>batch.delete(db.collection('lessons').doc(l._id)));
  batch.commit()
    .then(()=>{showToast('🗑 삭제됐습니다');closeTch();buildRSel();updCnt();rMgr();})
    .catch(e=>alert('삭제 실패: '+e.message));
};
